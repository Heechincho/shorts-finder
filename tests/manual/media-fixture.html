<!doctype html><meta charset="utf-8"><button id="make">Generate synthetic media</button><p id="state"></p><canvas width="640" height="360" id="c"></canvas><a id="video" download="fixture.mp4">Download video</a><a id="audio" download="fixture.wav">Download audio</a><script>
make.onclick=async()=>{const mime=['video/mp4','video/webm'].find(x=>MediaRecorder.isTypeSupported(x)),ctx=c.getContext('2d'),stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{video.href=URL.createObjectURL(new Blob(chunks,{type:mime}));video.download='fixture.'+(mime.includes('mp4')?'mp4':'webm');state.textContent='Ready '+mime;stream.getTracks().forEach(t=>t.stop());};rec.start();const start=performance.now();function draw(){const t=(performance.now()-start)/1000;ctx.fillStyle='#183f75';ctx.fillRect(0,0,640,360);ctx.fillStyle='#ffc342';ctx.fillRect(40+t*130,120,65,65);ctx.fillStyle='white';ctx.font='32px sans-serif';ctx.fillText('Browser render test '+t.toFixed(1),40,65);if(t<3)requestAnimationFrame(draw);else rec.stop();}draw();const n=48000*3,b=new ArrayBuffer(44+n*2),v=new DataView(b),s=(p,t)=>[...t].forEach((c,i)=>v.setUint8(p+i,c.charCodeAt(0)));s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,48000,true);v.setUint32(28,96000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(i/48000*Math.PI*440*2)*3000,true);audio.href=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));};</script>
