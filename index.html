<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떡상 쇼츠 파인더</title>
<style>
  :root{
    --ink:#F1F7F5; --side:#FFFFFF; --surface:#FFFFFF; --surface-2:#EEF5F2;
    --gold:#0E9C7C; --gold-bright:#0FB08B; --apricot:#E8845C;
    --text:#17302A; --text-muted:#6D8880; --line:#DCE8E4;
    --danger:#C9584A; --up:#12A06F; --ok:#12A06F;
    --shadow:0 1px 2px rgba(16,60,48,.06), 0 1px 3px rgba(16,60,48,.04);
    --shadow-hi:0 4px 14px rgba(16,60,48,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .app{display:flex;min-height:100vh;}

  /* 사이드바 */
  .side{width:238px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
    padding:20px 14px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .logo b{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .menu-label{font-size:10.5px;letter-spacing:.16em;color:var(--text-muted);padding:0 8px 10px;text-transform:uppercase;}
  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
    font-size:13.5px;color:var(--text-muted);transition:.15s;cursor:pointer;}
  .nav a:hover{background:var(--surface);color:var(--text);}
  .nav a.on{background:var(--gold);color:#fff;font-weight:700;}
  .nav .ic{width:24px;height:24px;border-radius:7px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .nav a.on .ic{background:rgba(255,255,255,.24);}
  .side-foot{margin-top:20px;padding:12px;border-radius:9px;background:var(--surface-2);
    font-size:11.5px;line-height:1.7;color:var(--text-muted);}
  .side-foot b{color:var(--gold-bright);}

  /* 본문 */
  .main{flex:1;min-width:0;padding:24px 28px 80px;}
  .phead{display:flex;align-items:center;gap:13px;margin-bottom:22px;}
  .phead .ic{width:42px;height:42px;border-radius:11px;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .phead h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .phead p{margin:2px 0 0;font-size:12.5px;color:var(--text-muted);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow);}
  .flabel{font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;
    font-weight:700;width:100%;margin-bottom:9px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .row + .flabel{margin-top:18px;}

  .chip{background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);
    padding:8px 15px;border-radius:20px;font-size:13px;cursor:pointer;transition:.15s;}
  .chip:hover{color:var(--text);border-color:var(--gold);}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;}
  .chip small{display:block;font-size:10px;opacity:.75;font-weight:400;}

  input[type=text],input[type=password],select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:9px;font-size:14px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .searchbar{display:flex;gap:9px;margin-bottom:16px;}
  .searchbar input{flex:1;min-width:0;padding:14px 16px;font-size:15px;}
  .go{background:linear-gradient(135deg,var(--gold-bright),var(--gold));border:none;color:#fff;
    padding:14px 30px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;}
  .go:hover{transform:translateY(-1px);}
  .go:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .go.block{width:100%;justify-content:center;}
  .btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:var(--gold);}

  .selects{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .selects label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .selects select{width:100%;}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .spacer{flex:1;}
  .count{font-size:13px;color:var(--text-muted);}
  .count b{color:var(--gold-bright);font-size:15px;}
  .quota{font-size:11.5px;color:var(--text-muted);opacity:.85;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow-hi);}
  .thumb{position:relative;display:block;width:100%;aspect-ratio:9/13;background:#000;overflow:hidden;}
  .thumb.wide{aspect-ratio:16/10;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .rank{position:absolute;top:8px;left:8px;background:rgba(20,18,16,.85);color:var(--gold-bright);
    font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .tag{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .tag.jackpot{background:var(--gold-bright);color:#fff;}
  .tag.hot{background:var(--apricot);color:#fff;}
  .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.78);color:#fff;
    font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;}
  .fav{position:absolute;bottom:8px;left:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(20,18,16,.78);border:none;color:var(--text-muted);font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .fav:hover{color:var(--gold-bright);}
  .fav.on{color:var(--gold-bright);background:rgba(230,195,77,.22);}
  .cbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .ctitle{font-size:13.5px;line-height:1.45;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;}
  .ctitle:hover{color:var(--gold-bright);}
  .cchan{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:auto;
    padding-top:10px;border-top:1px solid var(--line);
    font-size:11px;color:var(--text-muted);text-align:center;}
  .cstats div span{display:block;color:var(--text);font-weight:700;font-size:12.5px;margin-top:2px;}
  .cline{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text-muted);}
  .cline b{color:var(--gold-bright);font-size:13px;}
  .btrack{width:100%;height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .bfill{height:100%;border-radius:4px;}
  .preset{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .preset span{flex:1;min-width:220px;font-size:12px;color:var(--text-muted);line-height:1.7;}
  .preset .btn.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .warn{color:var(--apricot);font-size:10.5px;font-weight:700;margin-left:4px;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--text-muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .ldot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* 표 */
  .tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .trow{display:grid;grid-template-columns:52px 1fr 130px 100px;gap:12px;align-items:center;
    padding:13px 18px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .trow:last-child{border-bottom:none;}
  .trow.head{color:var(--text-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .trow:not(.head):hover{background:var(--surface-2);}
  a.trow{color:inherit;text-decoration:none;cursor:pointer;}
  .tr-rank{font-weight:700;color:var(--gold-bright);font-size:15px;}
  .tr-chan{display:flex;align-items:center;gap:11px;min-width:0;}
  .tr-chan img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .tr-chan .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tr-chan .sub{font-size:11.5px;color:var(--text-muted);}
  .tr-num{text-align:right;font-weight:700;}
  .tr-num.muted{color:var(--text-muted);font-weight:400;}
  @media (max-width:720px){
    .trow{grid-template-columns:40px 1fr 92px;}
    .trow > :nth-child(4){display:none;}
  }

  .msg{padding:52px 20px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.8;}
  .msg strong{color:var(--text);display:block;margin-bottom:8px;font-size:16px;}
  .msg .big{font-size:34px;display:block;margin-bottom:12px;}
  .msg a{color:var(--gold-bright);cursor:pointer;text-decoration:underline;}
  .err{background:#FCEDEB;border:1px solid var(--danger);color:#8C2F24;
    padding:15px 17px;border-radius:11px;font-size:13.5px;margin-bottom:16px;line-height:1.7;}
  .err b{color:#7A251B;}
  .note{font-size:12px;color:var(--text-muted);line-height:1.75;margin-top:12px;}
  .note b{color:var(--gold-bright);}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
    border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  /* 키 설정 */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;margin:16px 0;}
  .step{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .step b{display:block;color:var(--gold-bright);font-size:11.5px;margin-bottom:6px;letter-spacing:.06em;}
  .step span{font-size:13px;line-height:1.7;}
  .step code{background:var(--ink);padding:1px 5px;border-radius:4px;font-size:12px;}
  .keystate{font-size:13px;font-weight:700;margin-top:10px;}
  .keystate.ok{color:var(--ok);}
  .keystate.bad{color:var(--danger);}
  .banner{background:#E6F5F0;border:1px solid var(--gold);border-radius:12px;
    padding:15px 18px;margin-bottom:18px;font-size:13.5px;line-height:1.7;}
  .banner a{color:var(--gold-bright);cursor:pointer;text-decoration:underline;font-weight:700;}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .side{width:100%;height:auto;position:static;padding:14px;}
    .nav{flex-direction:row;overflow-x:auto;gap:6px;}
    .nav a{white-space:nowrap;padding:9px 13px;}
    .nav .ic,.menu-label,.side-foot{display:none;}
    .main{padding:18px 14px 60px;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="logo">
      <div class="logo-mark">👑</div>
      <b>떡상 쇼츠 파인더</b>
    </div>
    <div class="menu-label">메뉴</div>
    <nav class="nav" id="nav">
      <a data-page="search"><span class="ic">🔍</span>조회수 폭발 쇼츠 찾기</a>
      <a data-page="trend"><span class="ic">🔥</span>터진 영상</a>
      <a data-page="rank"><span class="ic">📈</span>채널 랭킹</a>
      <a data-page="fav"><span class="ic">⭐</span>즐겨찾기</a>
      <a data-page="key"><span class="ic">🔑</span>YouTube API 키 설정</a>
    </nav>
    <div class="side-foot">
      오늘 사용량 약 <b id="usedToday">0</b> 유닛<br>
      하루 한도 10,000 · 오후 4~5시 초기화
    </div>
  </aside>

  <main class="main">
    <div class="phead">
      <div class="ic" id="pgIcon">🔍</div>
      <div><h1 id="pgTitle">조회수 폭발 쇼츠 찾기</h1><p id="pgDesc">조건 맞춤 쇼츠 발굴</p></div>
    </div>
    <div id="banner"></div>
    <div id="page"></div>
  </main>
</div>

<script>
/* ===== 공통 ===== */
const KEY_STORE='yt_finder_key', DUR_STORE='yt_dur_cache', FAV_STORE='yt_favs', USE_STORE='yt_used';
const DATA_URL='data/trending.json';
// 로컬 파일이나 미리보기로 열었을 때는 저장소에서 직접 가져옵니다
const DATA_FALLBACK='https://raw.githubusercontent.com/Heechincho/shorts-finder/main/data/trending.json';

const CATEGORIES=[
  {l:'전체',kw:''},
  {l:'건조과일/홈메이드간식',kw:'건조과일 홈메이드 간식'},
  {l:'건강/의학',kw:'건강 의학 정보'},
  {l:'영화/드라마 리뷰',kw:'영화 리뷰'},
  {l:'연예인/이슈',kw:'연예인 이슈'},
  {l:'연예인 추천템',kw:'연예인 추천템'},
  {l:'재테크/부동산',kw:'재테크 부동산'},
  {l:'동기부여/명언',kw:'동기부여 명언'},
  {l:'AI/IT 꿀팁',kw:'AI 활용법'},
  {l:'라이프스타일/Vlog',kw:'브이로그'},
  {l:'반려동물',kw:'반려동물'},
  {l:'뷰티',kw:'뷰티'},
  {l:'요리',kw:'요리 레시피'},
  {l:'여행',kw:'여행'},
  {l:'육아',kw:'육아 아기'},
  {l:'취미',kw:'취미 생활'},
  {l:'종교',kw:'종교'},
];
const DEPTHS={
  fast:{orders:['viewCount'],pages:2,cost:200},
  normal:{orders:['viewCount','relevance'],pages:3,cost:600},
  deep:{orders:['viewCount','relevance','date'],pages:4,cost:1200},
  max:{orders:['viewCount','relevance','date','rating'],pages:6,cost:2400},
};
const PAGES={
  search:{ic:'🔍',t:'조회수 폭발 쇼츠 찾기',d:'검색 한 번으로 영상과 채널을 같이 봅니다'},
  trend:{ic:'🔥',t:'터진 영상',d:'급등하는 영상 확인'},
  rank:{ic:'📈',t:'채널 랭킹',d:'조회수 기준 채널 순위'},
  fav:{ic:'⭐',t:'즐겨찾기',d:'저장해 둔 영상'},
  key:{ic:'🔑',t:'YouTube API 키 설정',d:'내 키를 등록하면 모든 기능이 열립니다'},
};

const $=id=>document.getElementById(id);
const put=(id,html)=>{const e=$(id); if(e) e.innerHTML=html;};
const esc=s=>String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ls={
  get(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
};
function getKey(){ return ls.get(KEY_STORE,''); }
function setKey(k){ ls.set(KEY_STORE,k); }

function today(){ return new Date().toISOString().slice(0,10); }
function addUsed(n){
  const u=ls.get(USE_STORE,{d:today(),n:0});
  if(u.d!==today()){ u.d=today(); u.n=0; }
  u.n+=n; ls.set(USE_STORE,u);
  $('usedToday').textContent=u.n.toLocaleString();
}
function showUsed(){
  const u=ls.get(USE_STORE,{d:today(),n:0});
  $('usedToday').textContent=(u.d===today()?u.n:0).toLocaleString();
}

function fmtNum(n){
  n=Number(n)||0;
  if(n>=100000000) return (n/100000000).toFixed(1)+'억';
  if(n>=10000) return (n/10000).toFixed(1)+'만';
  return n.toLocaleString();
}
function fmtDur(sec){
  sec=Math.round(Number(sec)||0); if(!sec) return '';
  const m=Math.floor(sec/60),s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}
function toSec(v){
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const s=String(v);
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const m=s.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return m?parseInt(m[1]||0)*3600+parseInt(m[2]||0)*60+parseInt(m[3]||0):0;
}
function pick(o,keys){
  for(const k of keys){
    let c=o,ok=true;
    for(const p of k.split('.')){ if(c&&typeof c==='object'&&p in c) c=c[p]; else {ok=false;break;} }
    if(ok&&c!=null&&c!=='') return c;
  }
}
function scoreColor(s){ return s>=10?'var(--gold-bright)':s>=5?'var(--apricot)':'var(--text-muted)'; }
function errText(m){
  if(/API key not valid|API_KEY_INVALID|Bad Request/i.test(m)) return '잘못된 키예요. 앞뒤 공백을 확인해주세요';
  if(/has not been used|SERVICE_DISABLED|not enabled|disabled/i.test(m)) return 'YouTube Data API v3 사용 설정이 안 됐어요';
  if(/quota/i.test(m)) return '오늘 사용량을 다 썼어요. 한국 시간 오후 4~5시에 초기화됩니다';
  if(/referer|blocked|restricted/i.test(m)) return '키에 제한이 걸려 있어요. 제한을 없애주세요';
  return m.slice(0,70);
}

/* 즐겨찾기 */
function favs(){ return ls.get(FAV_STORE,[]); }
function isFav(id){ return favs().some(f=>f.id===id); }
function toggleFav(id,data){
  const list=favs(); const i=list.findIndex(f=>f.id===id);
  if(i>=0) list.splice(i,1); else list.unshift(data);
  ls.set(FAV_STORE,list);
  return i<0;
}
window.onFav=function(btn,id){
  const d=JSON.parse(decodeURIComponent(btn.dataset.v));
  const added=toggleFav(id,d);
  btn.classList.toggle('on',added);
  btn.textContent=added?'★':'☆';
  if(current==='fav') renderFav();
};

/* 유튜브 호출 */
async function yt(endpoint,params,cost){
  const res=await fetch('https://www.googleapis.com/youtube/v3/'+endpoint+'?'+new URLSearchParams(params));
  const data=await res.json();
  addUsed(cost);
  if(data.error) throw new Error(data.error.message||'요청 실패');
  return data;
}
async function batch(key,endpoint,ids,part){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const d=await yt(endpoint,{part:part,id:ids.slice(i,i+50).join(','),key:key},1);
    out.push(...(d.items||[]));
  }
  return out;
}
async function collectIds(key,q,publishedAfter,region,duration,depth,onp){
  const cfg=DEPTHS[depth]; const ids=new Set();
  for(const order of cfg.orders){
    let token=null;
    for(let p=0;p<cfg.pages;p++){
      const par={part:'snippet',q:q,type:'video',order:order,publishedAfter:publishedAfter,maxResults:'50',key:key};
      if(duration) par.videoDuration=duration;
      if(region){ par.regionCode=region; if(region==='KR') par.relevanceLanguage='ko'; }
      if(token) par.pageToken=token;
      let d;
      try{ d=await yt('search',par,100); }
      catch(e){ if(ids.size) return [...ids]; throw e; }
      (d.items||[]).forEach(i=>{ if(i.id&&i.id.videoId) ids.add(i.id.videoId); });
      if(onp) onp(ids.size);
      token=d.nextPageToken; if(!token) break;
    }
  }
  return [...ids];
}

/* 영상 → 지표 */
function enrich(videos,chStats){
  const now=Date.now();
  return videos.map(v=>{
    const views=parseInt(v.statistics.viewCount||0);
    const st=chStats[v.snippet.channelId]||{};
    const subs=st.hiddenSubscriberCount?0:parseInt(st.subscriberCount||0);
    const days=Math.max(1,Math.round((now-new Date(v.snippet.publishedAt))/86400000));
    const th=v.snippet.thumbnails;
    return {
      id:v.id, title:v.snippet.title, channel:v.snippet.channelTitle, channelId:v.snippet.channelId,
      thumb:(th.maxres||th.standard||th.high||th.medium||th.default).url,
      views, subs, days, dur:toSec(v.contentDetails&&v.contentDetails.duration),
      daily:Math.round(views/days), score:subs>0?views/subs:0,
    };
  });
}

function cardHTML(v,idx,fixedRank){
  const url='https://www.youtube.com/watch?v='+v.id;
  const wide=v.dur>180?' wide':'';
  let tag='';
  if(v.status&&STLABEL[v.status]) tag='<div class="tag" style="background:'+STCOLOR[v.status]+';color:#fff">'+STLABEL[v.status]+'</div>';
  else if(v.score>=10) tag='<div class="tag jackpot">대박</div>';
  else if(v.score>=5) tag='<div class="tag hot">떡상</div>';
  const rankLabel=fixedRank?'#'+fixedRank:(idx!=null?'#'+(idx+1):'');
  const fav=isFav(v.id);
  const data=encodeURIComponent(JSON.stringify({id:v.id,title:v.title,channel:v.channel,thumb:v.thumb,views:v.views,subs:v.subs,dur:v.dur,days:v.days,score:v.score,daily:v.daily,rate:v.rate,live:v.live}));
  const rateLine=v.rate
    ? '<div class="cline"><span>'+(v.live?'시간당 증가 <span style="color:var(--up)">●</span>':'시간당 평균')+'</span>'+
      '<b style="color:var(--up)">+'+fmtNum(v.rate)+'/h</b></div>'
    : '<div class="cline"><span>일일 조회수</span><b>'+fmtNum(v.daily)+'/일</b></div>';
  return '<div class="card">'+
    '<a class="thumb'+wide+'" href="'+url+'" target="_blank" rel="noopener">'+
      '<img src="'+v.thumb+'" alt="" loading="lazy">'+
      (rankLabel?'<div class="rank">'+rankLabel+'</div>':'')+tag+
      (v.dur?'<div class="dur">'+fmtDur(v.dur)+'</div>':'')+
    '</a>'+
    '<button class="fav'+(fav?' on':'')+'" data-v="'+data+'" onclick="onFav(this,\''+v.id+'\')">'+(fav?'★':'☆')+'</button>'+
    '<div class="cbody">'+
      '<a class="ctitle" href="'+url+'" target="_blank" rel="noopener">'+esc(v.title)+'</a>'+
      '<div class="cchan">'+esc(v.channel)+'</div>'+
      '<div class="cstats">'+
        '<div>구독자<span>'+(v.subs?fmtNum(v.subs):'비공개')+'</span></div>'+
        '<div>조회수<span>'+fmtNum(v.views)+'</span></div>'+
        '<div>업로드<span>'+v.days+'일 전</span></div>'+
      '</div>'+
      rateLine+
      '<div class="cline"><span>떡상지수'+
        (v.score>=5&&v.views<10000?' <span class="warn" title="구독자가 적어 지수만 커진 경우예요">⚠︎ 참고 가치 낮음</span>':'')+
        '</span><b style="color:'+scoreColor(v.score)+'">'+(v.subs?v.score.toFixed(1)+'x':'—')+'</b></div>'+
      '<div class="btrack"><div class="bfill" style="width:'+
        Math.min(100,(v.score/20)*100)+'%;background:'+scoreColor(v.score)+'"></div></div>'+
    '</div>'+
  '</div>';
}

function drawSearch(){
  const [lo,hi]=S.sub==='all'?[0,Infinity]:S.sub.split('-').map(Number);
  const minv=Number(S.minv)||0;
  let list=sResults.filter(v=>v.subs>=lo&&v.subs<=hi&&v.views>=minv);
  if(S.pick) list=list.filter(v=>v.score>=5);
  if(S.sort==='views') list.sort((a,b)=>b.views-a.views);
  else if(S.sort==='daily') list.sort((a,b)=>b.daily-a.daily);
  else if(S.sort==='subs') list.sort((a,b)=>b.subs-a.subs);
  else list.sort((a,b)=>b.score-a.score);
  if(S.view==='channel'){ drawSearchChannels(list); return; }

  $('cnt').innerHTML='<b>'+list.length+'개</b> 영상 · 유튜브에서 '+sFetched+'개 수집 후 걸러냈어요';
  $('out').innerHTML=list.length
    ? '<div class="grid">'+list.map((v,i)=>cardHTML(v,i)).join('')+'</div>'
    : '<div class="msg">이 조건에 맞는 영상이 없어요. 구독자 구간을 넓혀보세요.</div>';
}

// 같은 검색 결과를 채널 단위로 묶어서 보여줍니다 (추가 호출 없음)
function drawSearchChannels(list){
  const map={};
  list.forEach(v=>{
    const k=v.channelId||v.channel;
    if(!map[k]) map[k]={id:k,name:v.channel,subs:v.subs,views:0,n:0,
      thumb:(sChanInfo[k]&&sChanInfo[k].thumb)||v.thumb};
    map[k].views+=v.views; map[k].n++;
    if(v.subs>map[k].subs) map[k].subs=v.subs;
  });
  let chans=Object.values(map).map(c=>({...c,avg:Math.round(c.views/c.n),
    score:c.subs>0?(c.views/c.n)/c.subs:0}));

  if(S.sort==='subs') chans.sort((a,b)=>b.subs-a.subs);
  else if(S.sort==='score') chans.sort((a,b)=>b.score-a.score);
  else chans.sort((a,b)=>b.avg-a.avg);
  chans=chans.slice(0,50);

  $('cnt').innerHTML='<b>'+chans.length+'개</b> 채널 · 영상 '+list.length+'개를 묶었어요';
  if(!chans.length){ $('out').innerHTML='<div class="msg">조건에 맞는 채널이 없어요.</div>'; return; }

  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  $('out').innerHTML='<div class="tbl">'+
    '<div class="trow head"><span>순위</span><span>채널</span><span class="tr-num">평균 조회수</span><span class="tr-num">구독자</span></div>'+
    chans.map((c,i)=>'<a class="trow" href="https://www.youtube.com/channel/'+c.id+'" target="_blank" rel="noopener">'+
      '<span class="tr-rank">'+medal(i)+'</span>'+
      '<span class="tr-chan"><img src="'+c.thumb+'" alt="" loading="lazy">'+
        '<span style="min-width:0"><span class="nm">'+esc(c.name)+'</span>'+
        '<span class="sub">이 주제 영상 '+c.n+'개 · 떡상지수 '+c.score.toFixed(1)+'x</span></span></span>'+
      '<span class="tr-num">'+fmtNum(c.avg)+'</span>'+
      '<span class="tr-num muted">'+(c.subs?fmtNum(c.subs):'—')+'</span>'+
    '</a>').join('')+'</div>';
}
async function runSearch(){
  const key=getKey(); if(!key){ $('out').innerHTML=needKey(); return; }
  const q=$('q').value.trim(); if(!q){ $('out').innerHTML='<div class="msg">검색어를 입력해주세요.</div>'; return; }
  const btn=$('btnGo'); btn.disabled=true; btn.textContent='검색 중…';
  const before=ls.get(USE_STORE,{n:0}).n;
  try{
    const after=new Date(Date.now()-parseInt($('days').value)*86400000).toISOString();
    $('out').innerHTML='<div class="msg"><span class="spin"></span> 영상을 모으는 중…</div>';
    const ids=await collectIds(key,q,after,$('region').value,S.type==='short'?'short':'medium',S.depth,
      n=>$('out').innerHTML='<div class="msg"><span class="spin"></span> 영상을 모으는 중… '+n+'개</div>');
    sFetched=ids.length;
    if(!ids.length){ $('out').innerHTML='<div class="msg">조건에 맞는 영상이 없어요. 기간을 늘려보세요.</div>'; return; }

    $('out').innerHTML='<div class="msg"><span class="spin"></span> 조회수를 확인하는 중… '+ids.length+'개</div>';
    const vids=(await batch(key,'videos',ids,'snippet,statistics,contentDetails')).filter(v=>{
      const d=toSec(v.contentDetails&&v.contentDetails.duration);
      return S.type==='short'?(d>0&&d<=180):(d>180&&d<=1800);
    });
    if(!vids.length){ $('out').innerHTML='<div class="msg">길이 조건에 맞는 영상이 없어요.</div>'; return; }

    $('out').innerHTML='<div class="msg"><span class="spin"></span> 구독자 수를 확인하는 중…</div>';
    const chIds=[...new Set(vids.map(v=>v.snippet.channelId))];
    const chs=await batch(key,'channels',chIds,'snippet,statistics');
    const st={}; sChanInfo={};
    chs.forEach(c=>{
      st[c.id]=c.statistics;
      sChanInfo[c.id]={name:c.snippet.title,
        thumb:(c.snippet.thumbnails.medium||c.snippet.thumbnails.default).url};
    });

    sResults=enrich(vids,st);
    $('qt').textContent='이번 검색 약 '+(ls.get(USE_STORE,{n:0}).n-before).toLocaleString()+' 유닛 사용';
    drawSearch();
  }catch(e){
    $('out').innerHTML='<div class="err"><b>'+esc(errText(e.message||''))+'</b></div>';
  }finally{ btn.disabled=false; btn.textContent='검색'; }
}

/* ===== 2. 터진 영상 ===== */
const T={type:'short',sort:'rate',st:'all',cat:''};
let tItems=[],tInfo='';
const CATNAMES={'24':'엔터테인먼트','10':'음악','23':'코미디','26':'노하우/스타일','22':'인물/블로그',

const STLABEL={new:'신규',up:'상승',down:'하락',hold:'유지'};
const STCOLOR={new:'#3B8FC4',up:'#12A06F',down:'#D06A55',hold:'#8B9C96'};

function pgTrend(){
  const cats=[...new Set(tItems.map(v=>v.category).filter(Boolean))]
    .sort((a,b)=>(CATNAMES[a]||a).localeCompare(CATNAMES[b]||b));
  $('page').innerHTML=

      '<div style="width:1px;height:24px;background:var(--line);margin:0 6px"></div>'+
      chipRow('sort',[{v:'rate',l:'🔥 급등순'},{v:'views',l:'조회수순'},{v:'date',l:'최신순'}],T.sort)+
      '<span class="spacer"></span><button class="btn" id="btnRe">🔄 새로고침</button></div>'+

  bindChips(T,()=>{ if(tItems.length) drawTrend(); });
  $('btnRe').onclick=()=>loadTrend(true);
  if($('cat')) $('cat').onchange=e=>{ T.cat=e.target.value; drawTrend(); };
  if(tItems.length) drawTrend(); else loadTrend();

function drawTrend(){
  if(!$('tout')) return;
  let base=tItems.slice();
  if(T.type==='short') base=base.filter(v=>v.dur>0&&v.dur<=180);
  else if(T.type==='long') base=base.filter(v=>v.dur>180);
  if(T.cat) base=base.filter(v=>v.category===T.cat);

  const cnt={new:0,up:0,down:0,hold:0};
  base.forEach(v=>{ if(cnt[v.status]!=null) cnt[v.status]++; });
  const has=Object.values(cnt).some(n=>n>0);
  if($('strow')) $('strow').innerHTML = has
    ? '<button class="chip'+(T.st==='all'?' on':'')+'" data-g="st" data-v="all">전체 '+base.length+'</button>'+
      ['new','up','down','hold'].map(k=>'<button class="chip'+(T.st===k?' on':'')+'" data-g="st" data-v="'+k+'">'+
        '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+STCOLOR[k]+';margin-right:6px"></span>'+
        STLABEL[k]+' '+cnt[k]+'</button>').join('') : '';

  let list=base;
  if(T.st!=='all'&&has) list=list.filter(v=>v.status===T.st);
  if(T.sort==='views') list.sort((a,b)=>b.views-a.views);
  else if(T.sort==='date') list.sort((a,b)=>new Date(b.publishedAt||0)-new Date(a.publishedAt||0));
  else list.sort((a,b)=>(b.rate||b.daily)-(a.rate||a.daily));

  put('tcnt','<b>'+list.length+'개</b> 표시 중 · 수집 '+tItems.length+'개');
  const known=tItems.filter(v=>v.dur>0).length;
  put('tout',list.length
    ? '<div class="grid">'+list.map(v=>cardHTML(v,null,v.rank||null)).join('')+'</div>'
    : '<div class="msg">'+(T.type==='short'&&!known
        ? '<strong>영상 길이 정보가 없어요</strong>수집 스크립트가 dur 값을 저장하는지 확인해주세요.'
        : '조건에 맞는 영상이 없어요. 타입이나 카테고리를 넓혀보세요.')+'</div>');
}
async function loadTrend(force){
  put('tout','<div class="msg"><span class="spin"></span> 불러오는 중…</div>');
  try{
    let raw=null, viaFallback=false;
    try{
      const res=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      raw=await res.json();
    }catch(e1){
      const res2=await fetch(DATA_FALLBACK+'?t='+Date.now(),{cache:'no-store'});
      if(!res2.ok) throw new Error('HTTP '+res2.status);
      raw=await res2.json(); viaFallback=true;
    }
    let list=Array.isArray(raw)?raw:null;
    if(!list&&raw&&typeof raw==='object'){
      for(const k of ['videos','items','data','results','list']) if(Array.isArray(raw[k])){ list=raw[k]; break; }
      if(!list) for(const k of Object.keys(raw)) if(Array.isArray(raw[k])&&raw[k].length){ list=raw[k]; break; }
    }
    if(!list) throw new Error('영상 목록을 찾지 못했어요');

    const now=Date.now();
    tItems=list.map(o=>{
      const id=pick(o,['id.videoId','videoId','video_id','id'])||'';
      const publishedAt=pick(o,['published','publishedAt','published_at','snippet.publishedAt','date']);
      const days=publishedAt?Math.max(1,Math.round((now-new Date(publishedAt).getTime())/86400000)):1;
      const views=Number(pick(o,['views','viewCount','statistics.viewCount']))||0;
      const subs=Number(pick(o,['subs','subscriberCount','subscribers']))||0;
      let thumb=pick(o,['thumb','thumbnail','snippet.thumbnails.high.url','snippet.thumbnails.medium.url']);
      if(!thumb&&id) thumb='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
      const dur=toSec(pick(o,['dur','durationSeconds','duration','contentDetails.duration']));
      return {
        id, title:pick(o,['title','snippet.title'])||'(제목 없음)',
        channel:pick(o,['channel','channelTitle','snippet.channelTitle'])||'',
        channelId:pick(o,['channelId','snippet.channelId'])||'',
        thumb, views, subs, publishedAt, days, dur,
        rate:Number(o.rate)||0, live:!!o.live, status:o.status||'',
        rank:Number(o.rank)||0, category:String(o.category||''),
        daily:Math.round(views/days),
        score:Number(o.score)||(subs>0?views/subs:0),
      };
    }).filter(v=>v.id);

    const collectedAt=pick(raw,['collectedAt','updatedAt','timestamp','generatedAt']);
    const when=collectedAt?new Date(collectedAt).toLocaleString('ko-KR'):'';
    const known=tItems.filter(v=>v.dur>0).length;
    const liveN=tItems.filter(v=>v.live).length;
    let extra='';
    if(raw.compared) extra=' · 직전 수집과 비교 <b>'+raw.gapHours+'시간</b> 간격 · 실측 증가량 <b>'+liveN+'개</b>';
    else if(raw.prevCollectedAt) extra=' · <b>아직 비교할 간격이 안 됐어요</b> (다음 수집부터 실측 증가량 표시)';
    else extra=' · <b>첫 수집이라 증가량은 업로드 후 평균값이에요</b>';
    tInfo='✅ '+tItems.length+'개 수집'+(when?' · 마지막 '+esc(when):'')+
      (known?'':' · <b>길이 정보 없음</b>')+extra+
      (viaFallback?' · <b>저장소에서 직접 불러왔어요</b> (미리보기 모드)':'');
    put('tinfo',tInfo);
    if(!known&&T.type==='short'){ T.type='all';
      document.querySelectorAll('.chip[data-g="type"]').forEach(b=>b.classList.toggle('on',b.dataset.v==='all')); }
    if(current==='trend'){
      if(!$('cat')&&tItems.some(v=>v.category)) pgTrend(); else drawTrend();
    }
  }catch(e){
    const m=e.message||'';
    put('tinfo','불러오기 실패');
    put('tout','<div class="err"><b>'+
      (/HTTP 404/.test(m)?'data/trending.json 을 찾을 수 없어요. 자동 수집이 돌았는지 확인해주세요.':esc(m))+'</b></div>');
    put('rout','<div class="err"><b>순위를 만들 데이터를 불러오지 못했어요.</b></div>');
  }
}
async function fillDurations(){
  const key=getKey();
  const cache=ls.get(DUR_STORE,{});
  tItems.forEach(v=>{ if(!v.dur&&cache[v.id]!==undefined) v.dur=cache[v.id]; });
  const miss=tItems.filter(v=>!v.dur&&cache[v.id]===undefined).map(v=>v.id);
  if(!miss.length) return {ok:true,used:0};
  if(!key) return {ok:false};
  let used=0;
  try{
    for(let i=0;i<miss.length;i+=50){
      const b=miss.slice(i,i+50);
      put('tinfo','<span class="spin"></span> 영상 길이 확인 중… '+Math.min(i+50,miss.length)+'/'+miss.length);
      const d=await yt('videos',{part:'contentDetails',id:b.join(','),key:key},1); used++;
      (d.items||[]).forEach(it=>cache[it.id]=toSec(it.contentDetails&&it.contentDetails.duration));
      b.forEach(id=>{ if(cache[id]===undefined) cache[id]=0; });
    }
    const keys=Object.keys(cache);
    if(keys.length>3000){ const t={}; keys.slice(-3000).forEach(k=>t[k]=cache[k]); ls.set(DUR_STORE,t); }
    else ls.set(DUR_STORE,cache);
    tItems.forEach(v=>{ if(!v.dur&&cache[v.id]) v.dur=cache[v.id]; });
    return {ok:true,used};
  }catch(e){ return {ok:false,used}; }
}

/* ===== 3. 채널 랭킹 ===== */
const R={type:'all',cap:'all'};
function pgRank(){
  $('page').innerHTML=
  '<div class="panel">'+
    '<div class="row">'+chipRow('type',[{v:'all',l:'전체'},{v:'short',l:'쇼츠'},{v:'long',l:'롱폼'}],R.type)+
      '<div style="width:1px;height:24px;background:var(--line);margin:0 6px"></div>'+
      chipRow('cap',[{v:'all',l:'구독자 전체'},{v:'10000',l:'1만 미만'},{v:'100000',l:'10만 미만'},{v:'1000000',l:'100만 미만'}],R.cap)+
      '<span class="spacer"></span><span class="count" id="rcnt"></span></div>'+
    '<div class="note">터진 영상 수집 데이터를 채널별로 합산한 순위예요. 구독자 수는 API 키가 있을 때만 표시됩니다.</div>'+
  '</div>'+
  '<div id="rout"><div class="msg"><span class="spin"></span> 불러오는 중…</div></div>';
  bindChips(R,()=>drawRank());
  if(tItems.length) drawRank(); else loadTrend().then(()=>{ if(current==='rank') drawRank(); });
}
function drawRank(){
  if(!$('rout')) return;
  let vids=tItems.slice();
  if(R.type==='short') vids=vids.filter(v=>v.dur>0&&v.dur<=180);
  else if(R.type==='long') vids=vids.filter(v=>v.dur>180);

  const map={};
  vids.forEach(v=>{
    const k=v.channelId||v.channel;
    if(!map[k]) map[k]={name:v.channel,subs:v.subs,views:0,rate:0,n:0,thumb:v.thumb,short:0,long:0};
    map[k].views+=v.views; map[k].n++; map[k].rate+=(v.rate||0);
    if(v.subs>map[k].subs) map[k].subs=v.subs;
    if(v.dur>0&&v.dur<=180) map[k].short++; else if(v.dur>180) map[k].long++;
  });
  let list=Object.values(map);
  if(R.cap!=='all') list=list.filter(c=>c.subs===0||c.subs<Number(R.cap));
  list.sort((a,b)=>b.views-a.views);
  list=list.slice(0,50);

  $('rcnt').innerHTML='채널 <b>'+list.length+'개</b>';
  if(!list.length){ $('rout').innerHTML='<div class="msg">조건에 맞는 채널이 없어요.</div>'; return; }

  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  $('rout').innerHTML='<div class="tbl">'+
    '<div class="trow head"><span>순위</span><span>채널</span><span class="tr-num">합산 조회수</span><span class="tr-num">구독자</span></div>'+
    list.map((c,i)=>{
      const kind=c.short>c.long?'SHORTS':c.long>c.short?'LONG':'MIX';
      return '<div class="trow">'+
        '<span class="tr-rank">'+medal(i)+'</span>'+
        '<span class="tr-chan"><img src="'+c.thumb+'" alt="" loading="lazy">'+
          '<span style="min-width:0"><span class="nm">'+esc(c.name)+'</span>'+
          '<span class="sub">'+kind+' · 영상 '+c.n+'개</span></span></span>'+
        '<span class="tr-num">'+fmtNum(c.views)+'</span>'+
        '<span class="tr-num muted">'+(c.subs?fmtNum(c.subs):'—')+'</span>'+
      '</div>';
    }).join('')+'</div>';
}

  '<div class="panel">'+
    '<div class="flabel">내 API 키</div>'+
    '<div class="searchbar"><input type="password" id="k" placeholder="AIza..." autocomplete="off" spellcheck="false" value="'+esc(getKey())+'">'+
      '<button class="go" id="btnK">확인하고 저장</button></div>'+

  '</div>'+
  '<div class="panel">'+
    '<div class="flabel">키 받는 법 · 5분</div>'+
    '<div class="steps">'+
      '<div class="step"><b>STEP 1</b><span>구글 클라우드 콘솔에서 프로젝트를 하나 만듭니다.</span></div>'+
      '<div class="step"><b>STEP 2</b><span><code>API 및 서비스 → 라이브러리</code> 에서 <code>YouTube Data API v3</code> 를 찾아 <b>사용 설정</b>.</span></div>'+
      '<div class="step"><b>STEP 3</b><span><code>사용자 인증 정보 → 만들기 → API 키</code>. 데이터 종류를 물으면 <b>공개 데이터</b>.</span></div>'+
      '<div class="step"><b>STEP 4</b><span><code>AIza…</code> 로 시작하는 키를 복사해 위 칸에 붙여넣고 확인.</span></div>'+
    '</div>'+
    '<a class="go" style="display:inline-block;text-decoration:none" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">구글 클라우드 콘솔 열기 ↗</a>'+
    '<div class="note">카드 등록도 요금도 없는 <b>무료</b> 키예요. 하루 10,000유닛이고 한국 시간 오후 4~5시경 초기화됩니다.<br>'+
      '<b>키 제한 설정은 건드리지 마세요</b> — 잘못 설정하면 작동하지 않아요.</div>'+
  '</div>';
  $('btnK').onclick=checkKey;
  $('k').addEventListener('keydown',e=>{ if(e.key==='Enter') checkKey(); });

async function checkKey(){
  const k=$('k').value.trim();
  if(!k){ $('ks').textContent='키를 입력해주세요'; $('ks').className='keystate bad'; return; }
  $('ks').textContent='확인 중…'; $('ks').className='keystate';
  try{
    await yt('videos',{part:'id',id:'dQw4w9WgXcQ',key:k},1);
    setKey(k);
    $('ks').textContent='✓ 사용 가능한 키예요. 이제 모든 기능을 쓸 수 있습니다';
    $('ks').className='keystate ok';
  }catch(e){
    $('ks').textContent='✕ '+errText(e.message||'');
    $('ks').className='keystate bad';
  }
}
window.clearKey=function(){ setKey(''); $('k').value=''; $('ks').textContent='키를 지웠어요'; $('ks').className='keystate'; };
