<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떡상 쇼츠 파인더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#DDF3EB; --side:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F1F3; --surface-3:#E7E7EA;
    --line:#E4E4E8; --line-2:#D7D7DC;
    --gold:#B9840B; --gold-bright:#EA580C; --apricot:#EA580C;
    --text:#16181D; --text-muted:#6B7280;
    --danger:#DB3554; --up:#12966A; --ok:#12966A;
    --shadow:0 1px 2px rgba(15,16,20,.05), 0 1px 3px rgba(15,16,20,.04);
    --shadow-hi:0 14px 30px -10px rgba(15,16,20,.16);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1815; --side:#18191D; --surface:#18191D; --surface-2:#1F2024; --surface-3:#282A30;
      --line:#2C2D33; --line-2:#3A3B42;
      --gold:#F0B429; --gold-bright:#FF7A3D; --apricot:#FF7A3D;
      --text:#EEEFF2; --text-muted:#93969E;
      --danger:#FF6B80; --up:#33D690; --ok:#33D690;
      --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-hi:0 16px 32px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1815; --side:#18191D; --surface:#18191D; --surface-2:#1F2024; --surface-3:#282A30;
    --line:#2C2D33; --line-2:#3A3B42;
    --gold:#F0B429; --gold-bright:#FF7A3D; --apricot:#FF7A3D;
    --text:#EEEFF2; --text-muted:#93969E;
    --danger:#FF6B80; --up:#33D690; --ok:#33D690;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-hi:0 16px 32px -10px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-bright);color:#fff;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .app{display:flex;min-height:100vh;}

  /* 사이드바 */
  .side{width:238px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
    padding:20px 14px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .logo-mark{width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .logo b{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .menu-label{font-size:10px;letter-spacing:.14em;color:var(--text-muted);padding:0 8px 10px;text-transform:uppercase;
    font-family:"IBM Plex Mono",monospace;}
  .nav{display:flex;flex-direction:column;gap:5px;position:relative;}
  .nav a{position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
    font-size:13.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .18s var(--ease),background .18s var(--ease);cursor:pointer;}
  .nav a:hover{background:var(--surface-2);color:var(--text);}
  .nav a.on{background:var(--gold-bright);color:#fff;font-weight:700;
    box-shadow:0 6px 16px -6px color-mix(in srgb, var(--gold-bright) 60%, transparent);}
  .nav .ic{width:24px;height:24px;border-radius:7px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .18s var(--ease);}
  .nav a.on .ic{background:rgba(255,255,255,.22);}
  .side-foot{margin-top:20px;padding:13px 14px;border-radius:11px;background:var(--surface-2);
    border:1px solid var(--line);
    font-size:11.5px;line-height:1.7;color:var(--text-muted);font-family:"IBM Plex Mono",monospace;}
  .side-foot b{color:var(--gold-bright);}

  /* 본문 */
  .main{flex:1;min-width:0;padding:26px 30px 90px;}
  .phead{display:flex;align-items:center;gap:13px;margin-bottom:22px;}
  .phead .ic{width:40px;height:40px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--gold-bright);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .phead h1{margin:0;font-size:19.5px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;}
  .phead p{margin:2px 0 0;font-size:12.5px;color:var(--text-muted);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
    margin-bottom:18px;box-shadow:var(--shadow);}
  .flabel{font-size:10.5px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;
    font-weight:700;width:100%;margin-bottom:9px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .row + .flabel{margin-top:18px;}
  .toolbar{gap:10px;background:var(--surface-2);border:1px solid var(--line-2);
    border-radius:12px;padding:5px;width:fit-content;}
  .toolbar .chip,.toolbar .btn{height:42px;box-sizing:border-box;
    display:inline-flex;align-items:center;}
  .toolbar .segmented{background:var(--surface);}
  .toolbar .selectpill{background:transparent;border-color:transparent;}
  .toolbar .selectpill:hover{background:var(--surface-3);}
  .toolbar .divider{width:1px;height:22px;background:var(--line-2);margin:0 3px;flex-shrink:0;}

  .chip.chip-sm{padding:6px 13px;font-size:12.5px;}

  /* 검색창 캡슐형 */
  .searchbar-capsule{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:5px 6px 5px 16px;gap:10px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);}
  .searchbar-capsule:focus-within{border-color:var(--gold-bright);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 18%, transparent);}
  .searchbar-capsule .search-ic{font-size:16px;color:var(--text-muted);flex-shrink:0;}
  .searchbar-capsule input{background:transparent !important;border:none !important;
    padding:11px 0 !important;box-shadow:none !important;}
  .searchbar-capsule input:focus{box-shadow:none !important;}
  .searchbar-capsule .go{border-radius:10px;padding:11px 22px;flex-shrink:0;}

  /* 세그먼트 컨트롤 (영상 타입 스위치) */
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:3px;height:42px;box-sizing:border-box;gap:2px;}
  .segmented .chip{border:none;border-radius:8px;background:transparent;box-shadow:none;
    height:auto;padding:0 16px;}
  .segmented .chip:hover{transform:none;box-shadow:none;background:var(--surface-3);color:var(--text);}
  .segmented .chip:active{transform:scale(.94);}
  .segmented .chip.on{background:var(--gold-bright);color:#fff;
    box-shadow:0 3px 8px -3px color-mix(in srgb, var(--gold-bright) 55%, transparent);}
  .segmented .chip.on:hover{background:var(--gold-bright);}

  /* 아이콘 라벨 셀렉트 필 */
  .selectpill{display:inline-flex;align-items:center;gap:6px;height:42px;
    padding:0 8px 0 14px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;cursor:pointer;transition:border-color .16s var(--ease);}
  .selectpill:hover{border-color:color-mix(in srgb, var(--gold-bright) 40%, var(--line));}
  .selectpill:focus-within{border-color:var(--gold-bright);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 18%, transparent);}
  .selectpill .pill-ic{font-size:14px;flex-shrink:0;}
  .selectpill select{border:none !important;background:transparent !important;
    padding:0 20px 0 2px !important;height:auto;font-size:13.5px;font-weight:600;}
  .selectpill select:focus{box-shadow:none !important;}

  /* 프리셋 배너형 버튼 */
  .preset-banner{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:14px;
    margin-top:14px;padding:14px 18px;border-radius:12px;cursor:pointer;text-align:left;
    background:color-mix(in srgb, var(--gold-bright) 7%, var(--surface));
    border:1px solid color-mix(in srgb, var(--gold-bright) 30%, var(--line-2));
    transition:transform .1s cubic-bezier(.4,0,.2,1), border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);}
  .preset-banner:hover{border-color:var(--gold-bright);
    background:color-mix(in srgb, var(--gold-bright) 11%, var(--surface));
    box-shadow:0 8px 20px -10px color-mix(in srgb, var(--gold-bright) 45%, transparent);transform:translateY(-1px);}
  .preset-banner:active{transform:translateY(0) scale(.99);transition-duration:.05s;}
  .preset-banner:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 35%, transparent);}
  .pb-icon{font-size:22px;flex-shrink:0;}
  .pb-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .pb-text b{font-size:14px;color:var(--text);}
  .pb-text small{font-size:11.5px;color:var(--text-muted);font-weight:400;}
  .pb-arrow{font-size:16px;color:var(--gold-bright);flex-shrink:0;transition:transform .16s var(--ease);}
  .preset-banner:hover .pb-arrow{transform:translateX(3px);}
  .preset-banner.active{background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border-style:solid;border-color:var(--gold-bright);}
  .preset-banner.active .pb-text b,.preset-banner.active .pb-text small{color:#fff;}
  .preset-banner.active .pb-arrow{color:#fff;transform:rotate(90deg);}

  .chip{position:relative;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-muted);
    padding:7.5px 15px;border-radius:10px;font-size:13px;cursor:pointer;box-shadow:none;
    transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease),
      transform .1s cubic-bezier(.4,0,.2,1), box-shadow .16s var(--ease);}
  .chip:hover{color:var(--text);background:var(--surface-3);border-color:color-mix(in srgb, var(--gold-bright) 35%, var(--line-2));
    transform:translateY(-1px);}
  .chip:active{transform:scale(.94) translateY(0);box-shadow:inset 0 1px 3px rgba(0,0,0,.12);transition-duration:.05s;}
  .chip:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 35%, transparent);}
  .chip.on{background:color-mix(in srgb, var(--gold-bright) 14%, var(--surface));
    border-color:color-mix(in srgb, var(--gold-bright) 45%, var(--line-2));
    color:color-mix(in srgb, var(--gold-bright) 78%, var(--text));font-weight:700;box-shadow:none;}
  .chip.on:hover{background:color-mix(in srgb, var(--gold-bright) 20%, var(--surface));}
  .chip small{display:block;font-size:10px;opacity:.75;font-weight:400;}

  input[type=text],input[type=password],select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:9px;font-size:14px;font-family:inherit;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);}
  input:focus,select:focus{outline:none;border-color:var(--gold-bright);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 20%, transparent);}
  select{cursor:pointer;appearance:none;-webkit-appearance:none;-moz-appearance:none;
    padding-right:32px;
    background-image:
      linear-gradient(45deg,transparent 50%, var(--text-muted) 50%),
      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position:calc(100% - 17px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background-color .16s var(--ease);}
  select:hover{border-color:color-mix(in srgb, var(--gold-bright) 40%, var(--line));}
  .searchbar{display:flex;gap:9px;margin-bottom:16px;}
  .searchbar input{flex:1;min-width:0;padding:14px 16px;font-size:15px;}
  .go{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border:none;color:#fff;
    padding:14px 30px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;
    transition:transform .1s cubic-bezier(.4,0,.2,1), filter .16s var(--ease), box-shadow .16s var(--ease);
    box-shadow:0 8px 20px -8px color-mix(in srgb, var(--gold-bright) 65%, transparent);}
  .go::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-130%);transition:transform .55s ease;}
  .go:hover{filter:brightness(1.06);transform:translateY(-1px);
    box-shadow:0 12px 26px -8px color-mix(in srgb, var(--gold-bright) 70%, transparent);}
  .go:hover::after{transform:translateX(130%);}
  .go:active{transform:translateY(0) scale(.97);filter:brightness(.97);transition-duration:.05s;
    box-shadow:0 4px 10px -6px color-mix(in srgb, var(--gold-bright) 55%, transparent);}
  .go:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 35%, transparent),
    0 8px 20px -8px color-mix(in srgb, var(--gold-bright) 65%, transparent);}
  .go:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none;}
  .go.block{width:100%;justify-content:center;}
  .btn{position:relative;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    transition:transform .1s cubic-bezier(.4,0,.2,1), border-color .16s var(--ease), box-shadow .16s var(--ease);}
  .btn:hover{border-color:color-mix(in srgb, var(--gold-bright) 45%, var(--line));
    transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(0,0,0,.12);}
  .btn:active{transform:translateY(0) scale(.965);box-shadow:inset 0 1px 3px rgba(0,0,0,.1);transition-duration:.05s;}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-bright) 35%, transparent);}
  .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.32;transform:scale(0);
    animation:rip .5s var(--ease) forwards;pointer-events:none;}
  @keyframes rip{to{transform:scale(2.6);opacity:0;}}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .spacer{flex:1;}
  .count{font-size:13px;color:var(--text-muted);}
  .count b{color:var(--gold-bright);font-size:15px;font-family:"IBM Plex Mono",monospace;}
  .quota{font-size:11.5px;color:var(--text-muted);opacity:.85;font-family:"IBM Plex Mono",monospace;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
    transition:transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);}
  .card:hover{border-color:color-mix(in srgb, var(--gold-bright) 40%, var(--line));
    transform:translateY(-4px);box-shadow:var(--shadow-hi);}
  .thumbwrap{position:relative;}
  .thumb{position:relative;display:block;width:100%;aspect-ratio:9/13;background:#000;overflow:hidden;}
  .thumb.wide{aspect-ratio:16/10;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease);}
  .card:hover .thumb img{transform:scale(1.04);}
  .rank{position:absolute;top:8px;left:8px;background:rgba(10,14,10,.78);color:var(--gold-bright);
    font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;font-family:"IBM Plex Mono",monospace;}
  .tag{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .tag.jackpot{background:var(--gold);color:#1A1206;}
  .tag.hot{background:var(--apricot);color:#fff;}
  .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.78);color:#fff;
    font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;font-family:"IBM Plex Mono",monospace;}
  .fav{position:absolute;bottom:8px;left:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(10,14,10,.72);border:none;color:var(--text-muted);font-size:14px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s var(--ease), color .15s var(--ease);}
  .fav:hover{color:var(--gold-bright);transform:scale(1.08);}
  .fav:active{transform:scale(.85);}
  .fav.on{color:var(--gold);background:rgba(10,14,10,.72);}
  .fav.pop{animation:favpop .38s var(--ease);}
  @keyframes favpop{0%{transform:scale(1);}35%{transform:scale(1.45) rotate(-8deg);}100%{transform:scale(1);}}
  .cbody{padding:12px 13px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .ctitle{font-size:13.5px;line-height:1.45;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;}
  .ctitle:hover{color:var(--gold-bright);}
  .cchan{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:auto;
    padding-top:10px;border-top:1px solid var(--line);
    font-size:11px;color:var(--text-muted);text-align:center;}
  .cstats div span{display:block;color:var(--text);font-weight:700;font-size:12.5px;margin-top:2px;
    font-family:"IBM Plex Mono",monospace;}
  .cline{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);}
  .cline > span:first-child{min-width:0;}
  .cline b{color:var(--gold-bright);font-size:13px;font-family:"IBM Plex Mono",monospace;}
  .btrack{width:100%;height:5px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
  .bfill{height:100%;border-radius:4px;transition:width .7s var(--ease);}
  .preset{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .preset span{flex:1;min-width:220px;font-size:12px;color:var(--text-muted);line-height:1.7;}
  .btn.active{background:var(--gold-bright);border-color:var(--gold-bright);color:#fff;}
  .warn{display:block;color:var(--apricot);font-size:10px;font-weight:700;margin-top:1px;}
  .analyze{background:var(--surface);}
  .astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:12px;}
  .astats div{background:var(--surface-2);border-radius:10px;padding:12px 10px;text-align:center;}
  .astats b{display:block;font-size:18px;font-weight:700;color:var(--gold-bright);font-family:"IBM Plex Mono",monospace;}
  .astats span{display:block;font-size:11px;color:var(--text-muted);margin-top:3px;}
  .awords{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-muted);}
  .awords em{font-style:normal;background:var(--surface-2);border:1px solid var(--line-2);
    border-radius:10px;padding:5px 11px;font-size:12.5px;color:var(--text);}
  .awords em i{font-style:normal;color:var(--gold-bright);font-weight:700;font-family:"IBM Plex Mono",monospace;}
  .favwrap{display:flex;flex-direction:column;gap:7px;}
  .memo{width:100%;min-height:62px;resize:vertical;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-family:inherit;font-size:12.5px;color:var(--text);line-height:1.6;
    transition:border-color .2s var(--ease);}
  .memo:focus{outline:none;border-color:var(--gold-bright);}
  .memo.saved{border-color:var(--ok);}
  .chip.hist{font-size:12px;padding:6px 12px;}
  /* 상세 필터 접기/펼치기 */
  .adv{margin-top:16px;}
  .adv summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    padding:11px 15px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);
    font-size:13px;font-weight:600;color:var(--text-muted);user-select:none;
    transition:background .16s var(--ease), color .16s var(--ease),
      transform .1s cubic-bezier(.4,0,.2,1), box-shadow .16s var(--ease);}
  .adv summary::-webkit-details-marker{display:none;}

<script>
/* ===== 공통 ===== */
let toastT=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function ripple(btn,e){
  const r=btn.getBoundingClientRect(); const d=Math.max(r.width,r.height)*1.4;
  const el=document.createElement('span'); el.className='ripple';
  el.style.width=el.style.height=d+'px';
  el.style.left=(e.clientX-r.left-d/2)+'px'; el.style.top=(e.clientY-r.top-d/2)+'px';
  btn.appendChild(el); setTimeout(()=>el.remove(),600);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.go,.btn,.chip'); if(b) ripple(b,e);
});
const KEY_STORE='yt_finder_key', DUR_STORE='yt_dur_cache', FAV_STORE='yt_favs', USE_STORE='yt_used';
const DATA_URL='data/trending.json';
// 로컬 파일이나 미리보기로 열었을 때는 저장소에서 직접 가져옵니다
const HIST_URL='data/history.json';
const HIST_FALLBACK='https://raw.githubusercontent.com/Heechincho/shorts-finder/main/data/history.json';
const DATA_FALLBACK='https://raw.githubusercontent.com/Heechincho/shorts-finder/main/data/trending.json';

const CATEGORIES=[
  {l:'전체',kw:''},
  {l:'건조과일/홈메이드간식',kw:'건조과일 홈메이드 간식'},
  {l:'건강/의학',kw:'건강 의학 정보'},
  {l:'영화/드라마 리뷰',kw:'영화 리뷰'},
  {l:'연예인/이슈',kw:'연예인 이슈'},
  {l:'연예인 추천템',kw:'연예인 추천템'},
  {l:'재테크/부동산',kw:'재테크 부동산'},
  {l:'동기부여/명언',kw:'동기부여 명언'},
  {l:'AI/IT 꿀팁',kw:'AI 활용법'},
  {l:'라이프스타일/Vlog',kw:'브이로그'},
  {l:'반려동물',kw:'반려동물'},
  {l:'뷰티',kw:'뷰티'},
  {l:'요리',kw:'요리 레시피'},
  {l:'여행',kw:'여행'},
  {l:'육아',kw:'육아 아기'},
  {l:'취미',kw:'취미 생활'},
  {l:'종교',kw:'종교'},
];
const DEPTHS={
  fast:{orders:['viewCount'],pages:2,cost:200},
  normal:{orders:['viewCount','relevance'],pages:3,cost:600},
  deep:{orders:['viewCount','relevance','date'],pages:4,cost:1200},

};
const PAGES={
  search:{ic:'🔍',t:'조회수 폭발 쇼츠 찾기',d:'검색 한 번으로 영상과 채널을 같이 봅니다'},
  radar:{ic:'🎯',t:'내 분야 레이더',d:'지켜보는 채널의 최신 영상'},
  trend:{ic:'🔥',t:'터진 영상',d:'급등하는 영상 확인'},
  rank:{ic:'📈',t:'채널 랭킹',d:'조회수 기준 채널 순위'},
  fav:{ic:'⭐',t:'즐겨찾기',d:'저장해 둔 영상'},
  key:{ic:'🔑',t:'YouTube API 키 설정',d:'내 키를 등록하면 모든 기능이 열립니다'},
};

const $=id=>document.getElementById(id);
const put=(id,html)=>{const e=$(id); if(e) e.innerHTML=html;};
const esc=s=>String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ls={
  get(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
};
function getKey(){ return ls.get(KEY_STORE,''); }
function setKey(k){ ls.set(KEY_STORE,k); }

function today(){ return new Date().toISOString().slice(0,10); }
function addUsed(n){
  const u=ls.get(USE_STORE,{d:today(),n:0});
  if(u.d!==today()){ u.d=today(); u.n=0; }
  u.n+=n; ls.set(USE_STORE,u);
  $('usedToday').textContent=u.n.toLocaleString();
}
function showUsed(){
  const u=ls.get(USE_STORE,{d:today(),n:0});
  $('usedToday').textContent=(u.d===today()?u.n:0).toLocaleString();
}

function fmtNum(n){
  n=Number(n)||0;
  if(n>=100000000) return (n/100000000).toFixed(1)+'억';
  if(n>=10000) return (n/10000).toFixed(1)+'만';
  return n.toLocaleString();
}
function fmtDur(sec){
  sec=Math.round(Number(sec)||0); if(!sec) return '';
  const m=Math.floor(sec/60),s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}
function toSec(v){
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const s=String(v);
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const m=s.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  return m?parseInt(m[1]||0)*3600+parseInt(m[2]||0)*60+parseInt(m[3]||0):0;
}
function pick(o,keys){
  for(const k of keys){
    let c=o,ok=true;
    for(const p of k.split('.')){ if(c&&typeof c==='object'&&p in c) c=c[p]; else {ok=false;break;} }
    if(ok&&c!=null&&c!=='') return c;
  }
}
function scoreColor(s){ return s>=10?'var(--gold-bright)':s>=5?'var(--apricot)':'var(--text-muted)'; }
function errText(m){
  if(/API key not valid|API_KEY_INVALID|Bad Request/i.test(m)) return '잘못된 키예요. 앞뒤 공백을 확인해주세요';
  if(/has not been used|SERVICE_DISABLED|not enabled|disabled/i.test(m)) return 'YouTube Data API v3 사용 설정이 안 됐어요';
  if(/quota/i.test(m)) return '오늘 사용량을 다 썼어요. 한국 시간 오후 4~5시에 초기화됩니다';
  if(/referer|blocked|restricted/i.test(m)) return '키에 제한이 걸려 있어요. 제한을 없애주세요';
  return m.slice(0,70);
}

/* 즐겨찾기 */
function favs(){ return ls.get(FAV_STORE,[]); }
function isFav(id){ return favs().some(f=>f.id===id); }
function toggleFav(id,data){
  const list=favs(); const i=list.findIndex(f=>f.id===id);
  if(i>=0) list.splice(i,1); else list.unshift(data);
  ls.set(FAV_STORE,list);
  return i<0;
}
window.onFav=function(btn,id){
  const d=JSON.parse(decodeURIComponent(btn.dataset.v));
  const added=toggleFav(id,d);
  btn.classList.toggle('on',added);
  btn.textContent=added?'★':'☆';
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  if(current==='fav') renderFav();
};

/* 유튜브 호출 */
async function yt(endpoint,params,cost){
  const res=await fetch('https://www.googleapis.com/youtube/v3/'+endpoint+'?'+new URLSearchParams(params));
  const data=await res.json();
  addUsed(cost);
  if(data.error) throw new Error(data.error.message||'요청 실패');
  return data;
}
async function batch(key,endpoint,ids,part){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const d=await yt(endpoint,{part:part,id:ids.slice(i,i+50).join(','),key:key},1);
    out.push(...(d.items||[]));
  }
  return out;
}
async function collectIds(key,q,publishedAfter,region,duration,depth,onp){
  const cfg=DEPTHS[depth]; const ids=new Set();
  for(const order of cfg.orders){
    let token=null;
    for(let p=0;p<cfg.pages;p++){
      const par={part:'snippet',q:q,type:'video',order:order,publishedAfter:publishedAfter,maxResults:'50',key:key};
      if(duration) par.videoDuration=duration;
      if(region){ par.regionCode=region; if(region==='KR') par.relevanceLanguage='ko'; }
      if(token) par.pageToken=token;
      let d;
      try{ d=await yt('search',par,100); }
      catch(e){ if(ids.size) return [...ids]; throw e; }
      (d.items||[]).forEach(i=>{ if(i.id&&i.id.videoId) ids.add(i.id.videoId); });
      if(onp) onp(ids.size);
      token=d.nextPageToken; if(!token) break;
    }
  }
  return [...ids];
}

/* 영상 → 지표 */
function enrich(videos,chStats){
  const now=Date.now();
  return videos.map(v=>{
    const views=parseInt(v.statistics.viewCount||0);
    const st=chStats[v.snippet.channelId]||{};
    const subs=st.hiddenSubscriberCount?0:parseInt(st.subscriberCount||0);
    const days=Math.max(1,Math.round((now-new Date(v.snippet.publishedAt))/86400000));
    const th=v.snippet.thumbnails;
    return {
      id:v.id, title:v.snippet.title, channel:v.snippet.channelTitle, channelId:v.snippet.channelId,
      thumb:(th.maxres||th.standard||th.high||th.medium||th.default).url,
      views, subs, days, dur:toSec(v.contentDetails&&v.contentDetails.duration),
      daily:Math.round(views/days), score:subs>0?views/subs:0,
    };
  });
}

      '<button class="fav'+(fav?' on':'')+'" data-v="'+data+'" onclick="onFav(this,\''+v.id+'\')">'+(fav?'★':'☆')+'</button>'+
    '</div>'+

      '<a class="ctitle" href="'+url+'" target="_blank" rel="noopener">'+esc(v.title)+'</a>'+
      '<div class="cchan">'+esc(v.channel)+'</div>'+

function drawSearch(){
  const [lo,hi]=S.sub==='all'?[0,Infinity]:S.sub.split('-').map(Number);
  const minv=Number(S.minv)||0;
  let list=sResults.filter(v=>v.subs>=lo&&v.subs<=hi&&v.views>=minv);
  if(S.pick) list=list.filter(v=>v.score>=5);
  if(S.sort==='views') list.sort((a,b)=>b.views-a.views);
  else if(S.sort==='daily') list.sort((a,b)=>b.daily-a.daily);
  else if(S.sort==='subs') list.sort((a,b)=>b.subs-a.subs);
  else list.sort((a,b)=>b.score-a.score);
  if(S.view==='channel'){ put('statstrip',''); drawSearchChannels(list); return; }

  $('cnt').innerHTML='<b>'+list.length+'개</b> 영상 · 유튜브에서 '+sFetched+'개 수집 후 걸러냈어요';
  put('statstrip', tierStrip(list));
  $('out').innerHTML=list.length
    ? analyze(list)+'<div class="grid">'+list.map((v,i)=>cardHTML(v,i)).join('')+'</div>'
    : '<div class="msg">이 조건에 맞는 영상이 없어요. 구독자 구간을 넓혀보세요.</div>';
}
// 결과를 떡상지수 등급별로 한눈에 요약 (대박/떡상/일반)
function tierStrip(list){
  if(!list.length) return '';
  const jackpot=list.filter(v=>v.score>=10).length;
  const hot=list.filter(v=>v.score>=5&&v.score<10).length;
  const normal=list.length-jackpot-hot;
  return '<div class="stat-strip">'+
    '<div class="stile"><span class="sdot" style="background:var(--gold-bright)"></span><div><b>'+jackpot+'개</b><span>대박 · 10x 이상</span></div></div>'+
    '<div class="stile"><span class="sdot" style="background:var(--apricot)"></span><div><b>'+hot+'개</b><span>떡상 · 5~10x</span></div></div>'+
    '<div class="stile"><span class="sdot" style="background:var(--text-muted)"></span><div><b>'+normal+'개</b><span>일반 · 5x 미만</span></div></div>'+
  '</div>';
}

// 같은 검색 결과를 채널 단위로 묶어서 보여줍니다 (추가 호출 없음)
function drawSearchChannels(list){
  const map={};
  list.forEach(v=>{
    const k=v.channelId||v.channel;
    if(!map[k]) map[k]={id:k,name:v.channel,subs:v.subs,views:0,n:0,
      thumb:(sChanInfo[k]&&sChanInfo[k].thumb)||v.thumb};
    map[k].views+=v.views; map[k].n++;
    if(v.subs>map[k].subs) map[k].subs=v.subs;
  });
  let chans=Object.values(map).map(c=>({...c,avg:Math.round(c.views/c.n),
    score:c.subs>0?(c.views/c.n)/c.subs:0}));

  if(S.sort==='subs') chans.sort((a,b)=>b.subs-a.subs);
  else if(S.sort==='score') chans.sort((a,b)=>b.score-a.score);
  else chans.sort((a,b)=>b.avg-a.avg);
  chans=chans.slice(0,50);

  $('cnt').innerHTML='<b>'+chans.length+'개</b> 채널 · 영상 '+list.length+'개를 묶었어요';
  if(!chans.length){ $('out').innerHTML='<div class="msg">조건에 맞는 채널이 없어요.</div>'; return; }

  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  $('out').innerHTML='<div class="tbl">'+
    '<div class="trow head"><span>순위</span><span>채널</span><span class="tr-num">평균 조회수</span><span class="tr-num">구독자</span></div>'+
    chans.map((c,i)=>'<a class="trow" href="https://www.youtube.com/channel/'+c.id+'" target="_blank" rel="noopener">'+
      '<span class="tr-rank">'+medal(i)+'</span>'+
      '<span class="tr-chan"><img src="'+c.thumb+'" alt="" loading="lazy">'+
        '<span style="min-width:0"><span class="nm">'+esc(c.name)+'</span>'+
        '<span class="sub">이 주제 영상 '+c.n+'개 · 떡상지수 '+c.score.toFixed(1)+'x</span></span></span>'+
      '<span class="tr-num">'+fmtNum(c.avg)+'</span>'+
      '<span class="tr-num muted">'+(c.subs?fmtNum(c.subs):'—')+'</span>'+
    '</a>').join('')+'</div>';
}
async function runSearch(force){
  const key=getKey(); if(!key){ $('out').innerHTML=needKey(); return; }
  const q=$('q').value.trim(); if(!q){ $('out').innerHTML='<div class="msg">검색어를 입력해주세요.</div>'; return; }
  put('statstrip','');
  const days=parseInt($('days').value), region=$('region').value;
  const ck=cacheKey(q,days,region);
  if(!force){
    const hit=readCache(ck);
    if(hit){
      sResults=hit.items; sFetched=hit.fetched; pushHistory(q);
      const mins=Math.round((Date.now()-hit.t)/60000);
      $('qt').textContent='저장된 결과 사용 · '+mins+'분 전 검색 · 0 유닛';
      drawSearch(); renderHistory(); return;
    }
  }
  const btn=$('btnGo'); btn.disabled=true; btn.textContent='검색 중…';
  const before=ls.get(USE_STORE,{n:0}).n;
  try{
    const after=new Date(Date.now()-days*86400000).toISOString();
    $('out').innerHTML='<div class="msg"><span class="spin"></span> 영상을 모으는 중…</div>';
    const ids=await collectIds(key,q,after,region,S.type==='short'?'short':'medium',S.depth,
      n=>$('out').innerHTML='<div class="msg"><span class="spin"></span> 영상을 모으는 중… '+n+'개</div>');
    sFetched=ids.length;
    if(!ids.length){ $('out').innerHTML='<div class="msg">조건에 맞는 영상이 없어요. 기간을 늘려보세요.</div>'; return; }

    $('out').innerHTML='<div class="msg"><span class="spin"></span> 조회수를 확인하는 중… '+ids.length+'개</div>';
    const vids=(await batch(key,'videos',ids,'snippet,statistics,contentDetails')).filter(v=>{
      const d=toSec(v.contentDetails&&v.contentDetails.duration);
      return S.type==='short'?(d>0&&d<=180):(d>180&&d<=1800);
    });
    if(!vids.length){ $('out').innerHTML='<div class="msg">길이 조건에 맞는 영상이 없어요.</div>'; return; }

    $('out').innerHTML='<div class="msg"><span class="spin"></span> 구독자 수를 확인하는 중…</div>';
    const chIds=[...new Set(vids.map(v=>v.snippet.channelId))];
    const chs=await batch(key,'channels',chIds,'snippet,statistics');
    const st={}; sChanInfo={};
    chs.forEach(c=>{
      st[c.id]=c.statistics;

async function loadRadar(){
  try{
    let raw=null;
    try{
      const r=await fetch(RADAR_URL+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw 0; raw=await r.json();
    }catch(e){
      const r2=await fetch(RADAR_FALLBACK+'?t='+Date.now(),{cache:'no-store'});
      if(!r2.ok) throw new Error('404'); raw=await r2.json();
    }
    const nowT=Date.now();
    rdItems=(raw.items||[]).map(o=>{
      const days=Math.max(1,Math.round((nowT-new Date(o.published).getTime())/86400000));
      return {...o, days, daily:Math.round(o.views/days)};
    });
    rdChans=raw.channels||[];
    const when=raw.collectedAt?new Date(raw.collectedAt).toLocaleString('ko-KR'):'';
    const liveN=rdItems.filter(v=>v.live).length;
    rdInfo='✅ 채널 <b>'+raw.channelCount+'개</b>에서 영상 <b>'+raw.videoCount+'개</b>'+

      (raw.compared?' · 실측 증가량 '+liveN+'개':' · 증가량은 업로드 후 평균값')+
      ' · 이번 수집 '+(raw.unitsUsed||0)+'유닛';

      '이후에는 6시간마다 알아서 돕니다.</div>');

function drawRadar(){
  if(!$('rdout')) return;
  let list=rdItems.slice();
  if(RD.type==='short') list=list.filter(v=>v.dur>0&&v.dur<=180);
  else if(RD.type==='long') list=list.filter(v=>v.dur>180);
  if(RD.sub!=='all'){ const [lo,hi]=RD.sub.split('-').map(Number);
    list=list.filter(v=>v.subs>=lo&&v.subs<=hi); }
  const mv=Number(RD.minv)||0;
  if(mv) list=list.filter(v=>v.views>=mv);

  if(RD.view==='channel'){
    let chans=rdChans.slice();
    if(RD.sub!=='all'){ const [lo,hi]=RD.sub.split('-').map(Number);
      chans=chans.filter(c=>c.subs>=lo&&c.subs<=hi); }
    if(RD.type==='short') chans=chans.filter(c=>c.shorts>0);
    else if(RD.type==='long') chans=chans.filter(c=>c.longs>0);
    if(RD.sort==='views') chans.sort((a,b)=>b.views-a.views);
    else if(RD.sort==='score') chans.sort((a,b)=>b.best-a.best);
    else chans.sort((a,b)=>b.avg-a.avg);
    chans=chans.slice(0,60);
    put('rdcnt','채널 <b>'+chans.length+'개</b>');
    const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    put('rdout','<div class="chgrid">'+chans.map((c,i)=>
      '<a class="chcard" href="https://www.youtube.com/channel/'+c.channelId+'" target="_blank" rel="noopener">'+
        '<div class="chrank'+(i<3?' top':'')+'">'+medal(i)+'</div>'+
        '<img class="chimg" src="'+c.thumb+'" alt="" loading="lazy">'+
        '<div class="chname">'+esc(c.name)+'</div>'+
        '<div class="chsub">'+(c.shorts>c.longs?'SHORTS':c.longs>c.shorts?'LONG':'MIX')+
          ' · 영상 '+c.videos+'개 · 최고 '+c.best.toFixed(1)+'x</div>'+
        '<div class="chnum"><b>'+fmtNum(c.avg)+'</b><span>평균 조회수</span></div>'+
        '<div class="chsubs">구독자 '+(c.subs?fmtNum(c.subs):'—')+'</div>'+
      '</a>').join('')+'</div>');
    return;
  }

  if(RD.sort==='views') list.sort((a,b)=>b.views-a.views);
  else if(RD.sort==='rate') list.sort((a,b)=>b.rate-a.rate);
  else if(RD.sort==='date') list.sort((a,b)=>new Date(b.published)-new Date(a.published));
  else list.sort((a,b)=>b.score-a.score);
  list=list.slice(0,120);

  put('rdcnt','<b>'+list.length+'개</b> 영상 · 수집 '+rdItems.length+'개');
  put('rdout', list.length
    ? analyze(list)+'<div class="grid">'+list.map((v,i)=>cardHTML(v,i)).join('')+'</div>'
    : '<div class="msg">조건에 맞는 영상이 없어요. 구간을 넓혀보세요.</div>');
}

        daily:Math.round(views/days),
        score:Number(o.score)||(subs>0?views/subs:0),

    const collectedAt=pick(raw,['collectedAt','updatedAt','timestamp','generatedAt']);
    const when=collectedAt?new Date(collectedAt).toLocaleString('ko-KR'):'';
    const known=tItems.filter(v=>v.dur>0).length;

    else extra=' · <b>첫 수집이라 증가량은 업로드 후 평균값이에요</b>';

async function fillDurations(){
  const key=getKey();
  const cache=ls.get(DUR_STORE,{});
  tItems.forEach(v=>{ if(!v.dur&&cache[v.id]!==undefined) v.dur=cache[v.id]; });
  const miss=tItems.filter(v=>!v.dur&&cache[v.id]===undefined).map(v=>v.id);
  if(!miss.length) return {ok:true,used:0};
  if(!key) return {ok:false};
  let used=0;
  try{
    for(let i=0;i<miss.length;i+=50){
      const b=miss.slice(i,i+50);
      put('tinfo','<span class="spin"></span> 영상 길이 확인 중… '+Math.min(i+50,miss.length)+'/'+miss.length);
      const d=await yt('videos',{part:'contentDetails',id:b.join(','),key:key},1); used++;
      (d.items||[]).forEach(it=>cache[it.id]=toSec(it.contentDetails&&it.contentDetails.duration));
      b.forEach(id=>{ if(cache[id]===undefined) cache[id]=0; });
    }
    const keys=Object.keys(cache);
    if(keys.length>3000){ const t={}; keys.slice(-3000).forEach(k=>t[k]=cache[k]); ls.set(DUR_STORE,t); }
    else ls.set(DUR_STORE,cache);
    tItems.forEach(v=>{ if(!v.dur&&cache[v.id]) v.dur=cache[v.id]; });
    return {ok:true,used};
  }catch(e){ return {ok:false,used}; }
}

  '<div id="rout"><div class="msg"><span class="spin"></span> 불러오는 중…</div></div>';
  bindChips(R,(g)=>{
    if(g==='src'&&R.src==='now'&&!tItems.length){
      put('rout','<div class="msg"><span class="spin"></span> 불러오는 중…</div>');
      loadTrend().then(()=>{ if(current==='rank') drawRank(); });
      return;
    }
    drawRank();
  });

  loadHistory().then(has=>{
    if(!$('rsrc')) return;
    $('rsrc').innerHTML = has
      ? chipRow('src',[{v:'hist',l:'📚 최근 7일 누적'},{v:'now',l:'⏱ 지금 이 순간'}],R.src)
      : '';
    if(!has) R.src='now';
    if(R.src==='now'&&!tItems.length) loadTrend().then(()=>{ if(current==='rank') drawRank(); });
    else drawRank();
  });
}
function drawRank(){
  if(!$('rout')) return;

  // 누적 데이터가 있으면 그걸 쓰고, 없으면 지금 이 순간 데이터로
  if(R.src==='hist'&&hChannels){
    let list=hChannels.slice();
    if(R.type==='short') list=list.filter(c=>c.shorts>0);
    else if(R.type==='long') list=list.filter(c=>c.longs>0);
    if(R.cap!=='all') list=list.filter(c=>c.subs===0||c.subs<Number(R.cap));
    list.sort((a,b)=>R.sort==='rate'?(b.avg-a.avg):(b.views-a.views));
    put('rinfo',hInfoLine);
    renderRankTable(list.slice(0,50),
      R.sort==='rate'?'평균 조회수':'7일 합산 조회수',
      c=>R.sort==='rate'?fmtNum(c.avg):fmtNum(c.views),
      c=>(c.shorts>c.longs?'SHORTS':c.longs>c.shorts?'LONG':'MIX')+' · 영상 '+c.videos+'개'+
         (c.bestRank<999?' · 최고 '+c.bestRank+'위':''));
    return;
  }

  if(!tItems.length){ put('rout','<div class="msg"><span class="spin"></span> 불러오는 중…</div>'); return; }
  let vids=tItems.slice();
  if(R.type==='short') vids=vids.filter(v=>v.dur>0&&v.dur<=180);
  else if(R.type==='long') vids=vids.filter(v=>v.dur>180);

  const map={};
  vids.forEach(v=>{
    const k=v.channelId||v.channel;
    if(!map[k]) map[k]={channelId:v.channelId||'',name:v.channel,subs:v.subs,views:0,rate:0,videos:0,thumb:v.thumb,shorts:0,longs:0};
    map[k].views+=v.views; map[k].videos++; map[k].rate+=(v.rate||0);
    if(v.subs>map[k].subs) map[k].subs=v.subs;
    if(v.dur>0&&v.dur<=180) map[k].shorts++; else if(v.dur>180) map[k].longs++;
  });
  let list=Object.values(map);
  if(R.cap!=='all') list=list.filter(c=>c.subs===0||c.subs<Number(R.cap));
  list.sort((a,b)=>R.sort==='rate'?(b.rate-a.rate):(b.views-a.views));

  put('rinfo','지금 이 순간의 급상승 '+tItems.length+'개를 채널별로 묶은 순위예요. '+
    '급상승 차트는 채널당 한 편만 올려주기 때문에 대부분 <b>영상 1개</b>로 나옵니다.');
  renderRankTable(list.slice(0,50),
    R.sort==='rate'?'시간당 증가':'합산 조회수',
    c=>R.sort==='rate'?'+'+fmtNum(c.rate)+'/h':fmtNum(c.views),
    c=>(c.shorts>c.longs?'SHORTS':c.longs>c.shorts?'LONG':'MIX')+' · 영상 '+c.videos+'개');
}

function renderRankTable(list,numLabel,numFn,subFn){
  put('rcnt','채널 <b>'+list.length+'개</b>');
  if(!list.length){ put('rout','<div class="msg">조건에 맞는 채널이 없어요.</div>'); return; }
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);

  if(R.rview==='card'){
    put('rout','<div class="chgrid">'+list.map((c,i)=>{
      const open=c.channelId?'<a class="chcard" href="https://www.youtube.com/channel/'+c.channelId+'" target="_blank" rel="noopener">':'<div class="chcard">';
      const close=c.channelId?'</a>':'</div>';
      const top=i<3;
      return open+
        '<div class="chrank'+(top?' top':'')+'">'+medal(i)+'</div>'+
        '<img class="chimg" src="'+c.thumb+'" alt="" loading="lazy">'+
        '<div class="chname">'+esc(c.name)+'</div>'+
        '<div class="chsub">'+subFn(c)+'</div>'+
        '<div class="chnum"><b>'+numFn(c)+'</b><span>'+numLabel+'</span></div>'+
        '<div class="chsubs">구독자 '+(c.subs?fmtNum(c.subs):'—')+'</div>'+
      close;
    }).join('')+'</div>');
    return;
  }

  put('rout','<div class="tbl">'+
    '<div class="trow head"><span>순위</span><span>채널</span><span class="tr-num">'+numLabel+
      '</span><span class="tr-num">구독자</span></div>'+
    list.map((c,i)=>{
      const open=c.channelId?'<a class="trow" href="https://www.youtube.com/channel/'+c.channelId+'" target="_blank" rel="noopener">':'<div class="trow">';
      const close=c.channelId?'</a>':'</div>';
      return open+
        '<span class="tr-rank">'+medal(i)+'</span>'+
        '<span class="tr-chan"><img src="'+c.thumb+'" alt="" loading="lazy">'+
          '<span style="min-width:0"><span class="nm">'+esc(c.name)+'</span>'+
          '<span class="sub">'+subFn(c)+'</span></span></span>'+
        '<span class="tr-num">'+numFn(c)+'</span>'+
        '<span class="tr-num muted">'+(c.subs?fmtNum(c.subs):'—')+'</span>'+
      close;
    }).join('')+'</div>');
}

/* ===== 검색 결과 캐시 (같은 조건이면 유닛 0) ===== */
const CACHE_STORE='yt_search_cache', HIST_STORE='yt_kw_history', CACHE_HOURS=6;
function cacheKey(q,days,region){ return [q,days,region,S.type,S.depth].join('|'); }
function readCache(k){
  const c=ls.get(CACHE_STORE,{});
  const hit=c[k];
  if(!hit) return null;
  if((Date.now()-hit.t)/3600000 > CACHE_HOURS) return null;
  return hit;
}
function writeCache(k,items,fetched){
  const c=ls.get(CACHE_STORE,{});
  c[k]={t:Date.now(),items:items,fetched:fetched};
  const keys=Object.keys(c).sort((a,b)=>c[a].t-c[b].t);
  while(keys.length>8){ delete c[keys.shift()]; }
  ls.set(CACHE_STORE,c);
}
function pushHistory(q){
  let h=ls.get(HIST_STORE,[]);
  h=[q].concat(h.filter(x=>x!==q)).slice(0,10);
  ls.set(HIST_STORE,h);
}

/* ===== 패턴 분석 — 상위 영상들의 공통점 (유닛 0) ===== */
const STOPWORDS=new Set(['그','이','저','것','수','때','더','및','등','좀','너무','진짜','정말','하는','하고','에서','으로','에게','shorts','shorts','the','a','of','and','for','to','in','is','my','you']);
function analyze(list){
  const top=list.slice(0,20);
  if(top.length<5) return '';
  const titles=top.map(v=>v.title);
  const avgLen=Math.round(titles.reduce((a,t)=>a+t.length,0)/titles.length);
  const pct=n=>Math.round(n/top.length*100);
  const hasNum=pct(titles.filter(t=>/\d/.test(t)).length);
  const hasQ=pct(titles.filter(t=>/[?？]/.test(t)).length);
  const hasBracket=pct(titles.filter(t=>/[\[\]("'"'《〈]/.test(t)).length);
  const avgDur=Math.round(top.reduce((a,v)=>a+(v.dur||0),0)/top.length);
  const DAY=['일','월','화','수','목','금','토'];
  const dayCnt={};
  top.forEach(v=>{ if(v.v&&v.v.snippet){ const d=new Date(v.v.snippet.publishedAt).getDay(); dayCnt[d]=(dayCnt[d]||0)+1; } });
  const bestDay=Object.keys(dayCnt).sort((a,b)=>dayCnt[b]-dayCnt[a])[0];

  const wc={};
  titles.forEach(t=>{
    (t.match(/[가-힣A-Za-z]{2,}/g)||[]).forEach(w=>{
      const lw=w.toLowerCase();
      if(STOPWORDS.has(lw)||lw.length<2) return;
      wc[w]=(wc[w]||0)+1;
    });
  });
  const words=Object.keys(wc).filter(w=>wc[w]>=2).sort((a,b)=>wc[b]-wc[a]).slice(0,6);

  return '<div class="panel analyze">'+
    '<div class="flabel">📌 상위 '+top.length+'개의 공통점 <span style="font-weight:400;letter-spacing:0;text-transform:none;opacity:.75">여기서 패턴을 찾는 게 진짜 공부예요</span></div>'+
    '<div class="astats">'+
      '<div><b>'+avgLen+'자</b><span>평균 제목 길이</span></div>'+
      '<div><b>'+hasNum+'%</b><span>제목에 숫자</span></div>'+
      '<div><b>'+hasQ+'%</b><span>제목에 물음표</span></div>'+
      '<div><b>'+hasBracket+'%</b><span>괄호·따옴표</span></div>'+
      '<div><b>'+fmtDur(avgDur)+'</b><span>평균 길이</span></div>'+
      (bestDay!=null?'<div><b>'+DAY[bestDay]+'요일</b><span>가장 많이 업로드</span></div>':'')+
    '</div>'+
    (words.length?'<div class="awords"><span>자주 쓰인 단어</span>'+
      words.map(w=>'<em>'+esc(w)+' <i>'+wc[w]+'</i></em>').join('')+'</div>':'')+
    '<div class="note">이 숫자들은 <b>결과</b>일 뿐이에요. 실제로 배우려면 상위 3개를 열어서 <b>첫 3초에 무엇이 나오는지</b> 직접 보세요.</div>'+
  '</div>';
}

/* ===== 즐겨찾기 메모 · CSV ===== */
window.saveMemo=function(el,id){
  const list=favs(); const f=list.find(x=>x.id===id);
  if(f){ f.memo=el.value; ls.set(FAV_STORE,list); el.classList.add('saved');
    setTimeout(()=>el.classList.remove('saved'),900); }
};
function toCSV(){
  const rows=[['제목','채널','조회수','구독자','떡상지수','길이(초)','업로드전(일)','메모','링크']];
  favs().forEach(f=>rows.push([f.title,f.channel,f.views,f.subs,
    (f.score||0).toFixed(1),f.dur||'',f.days||'',f.memo||'',
    'https://www.youtube.com/watch?v='+f.id]));
  return '\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
window.downloadCSV=function(){
  const blob=new Blob([toCSV()],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='떡상쇼츠_즐겨찾기_'+today()+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSV로 내보냈어요');
};

      '첫 3초, 썸네일 문구, 후킹 방식 같은 걸 적어두면 나중에 패턴이 보입니다. CSV로 내보내면 엑셀·노션에서 이어서 정리할 수 있어요.</div>'+

/* ===== 5. API 키 설정 ===== */
function pgKey(){
  $('page').innerHTML=
  '<div class="panel">'+
    '<div class="flabel">내 API 키</div>'+
    '<div class="searchbar"><input type="password" id="k" placeholder="AIza..." autocomplete="off" spellcheck="false" value="'+esc(getKey())+'">'+
      '<button class="go" id="btnK">확인하고 저장</button></div>'+
    '<div class="keystate" id="ks"></div>'+
    '<div class="note">키는 이 브라우저에만 저장되고 어디로도 전송되지 않아요. 유튜브 요청은 이 페이지에서 구글로 직접 갑니다.<br>'+
      '<a onclick="clearKey()" style="color:var(--gold-bright);cursor:pointer;text-decoration:underline">저장된 키 지우기</a></div>'+
  '</div>'+
  '<div class="panel">'+
    '<div class="flabel">키 받는 법 · 5분</div>'+
    '<div class="steps">'+
      '<div class="step"><b>STEP 1</b><span>구글 클라우드 콘솔에서 프로젝트를 하나 만듭니다.</span></div>'+
      '<div class="step"><b>STEP 2</b><span><code>API 및 서비스 → 라이브러리</code> 에서 <code>YouTube Data API v3</code> 를 찾아 <b>사용 설정</b>.</span></div>'+
      '<div class="step"><b>STEP 3</b><span><code>사용자 인증 정보 → 만들기 → API 키</code>. 데이터 종류를 물으면 <b>공개 데이터</b>.</span></div>'+
      '<div class="step"><b>STEP 4</b><span><code>AIza…</code> 로 시작하는 키를 복사해 위 칸에 붙여넣고 확인.</span></div>'+
    '</div>'+
    '<a class="go" style="display:inline-block;text-decoration:none" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">구글 클라우드 콘솔 열기 ↗</a>'+
    '<div class="note">카드 등록도 요금도 없는 <b>무료</b> 키예요. 하루 10,000유닛이고 한국 시간 오후 4~5시경 초기화됩니다.<br>'+
      '<b>키 제한 설정은 건드리지 마세요</b> — 잘못 설정하면 작동하지 않아요.</div>'+
  '</div>';
  $('btnK').onclick=checkKey;
  $('k').addEventListener('keydown',e=>{ if(e.key==='Enter') checkKey(); });
  if(getKey()) $('ks').textContent='저장된 키가 있어요';
}
async function checkKey(){
  const k=$('k').value.trim();
  if(!k){ $('ks').textContent='키를 입력해주세요'; $('ks').className='keystate bad'; return; }
  $('ks').textContent='확인 중…'; $('ks').className='keystate';
  try{
    await yt('videos',{part:'id',id:'dQw4w9WgXcQ',key:k},1);
    setKey(k);
    $('ks').textContent='✓ 사용 가능한 키예요. 이제 모든 기능을 쓸 수 있습니다';
    $('ks').className='keystate ok';
  }catch(e){
    $('ks').textContent='✕ '+errText(e.message||'');
    $('ks').className='keystate bad';
  }
}
window.clearKey=function(){ setKey(''); $('k').value=''; $('ks').textContent='키를 지웠어요'; $('ks').className='keystate'; };
