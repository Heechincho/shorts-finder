name: 내 분야 레이더

on:
  schedule:
    # 6시간마다 (UTC 기준 0, 6, 12, 18시 = 한국 시간 9, 15, 21, 3시)
    - cron: '15 */6 * * *'
  workflow_dispatch:      # 버튼으로 직접 실행할 수도 있습니다
    inputs:
      seed_per_run:
        description: '이번 실행에서 탐색할 키워드 수 (채널을 빨리 늘리고 싶을 때 크게)'
        required: false
        default: '2'
      max_units:
        description: '이번 실행에서 쓸 최대 유닛'
        required: false
        default: '3000'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 레이더 수집 실행
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          REGION: KR
          SEED_PER_RUN: ${{ github.event.inputs.seed_per_run || '2' }}
          MAX_UNITS: ${{ github.event.inputs.max_units || '3000' }}
        run: node scripts/watch.js

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar.json data/watchlist.json
          git diff --staged --quiet || git commit -m "레이더 수집: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
