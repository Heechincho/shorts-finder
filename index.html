<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떡상 쇼츠 파인더</title>
<style>
  :root{
    --ink:#1A1610; --surface:#24201A; --surface-2:#2E2820;
    --gold:#C9A227; --gold-bright:#E6C34D; --apricot:#E8845C;
    --text:#F5EFE0; --text-muted:#A89B82; --line:#3A3327;
    --danger:#C9584A; --up:#5FBF7F; --down:#D8705F; --new:#5BA9D8; --hold:#8A8272;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px;}
  a{color:inherit;text-decoration:none;}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  h1{margin:0;font-family:Georgia,"Nanum Myeongjo",serif;font-size:30px;font-weight:700;letter-spacing:-.01em;}
  h1 em{color:var(--apricot);font-style:normal;}
  .keybox{display:flex;flex-direction:column;gap:5px;}
  .keybox label{font-size:12px;color:var(--text-muted);}
  .keybox input{background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:9px 12px;border-radius:8px;font-size:13px;width:270px;
    font-family:"SFMono-Regular",Consolas,monospace;}
  .keybox input:focus{outline:none;border-color:var(--gold);}
  .keybox .note{font-size:11px;color:var(--text-muted);opacity:.75;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{background:none;border:1px solid var(--line);color:var(--text-muted);
    padding:11px 20px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:.15s;}
  .tab:hover{color:var(--text);border-color:var(--gold);}
  .tab.on{background:var(--apricot);border-color:var(--apricot);color:#1A1610;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:22px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row + .row{margin-top:14px;}
  .flabel{font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;
    font-weight:700;width:100%;margin-bottom:-4px;}
  .chip{background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);
    padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;}
  .chip:hover{color:var(--text);border-color:var(--gold);}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1A1610;font-weight:700;}
  select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit;}
  #q{flex:1;min-width:240px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);padding:13px 16px;border-radius:10px;font-size:15px;font-family:inherit;}
  #q:focus{outline:none;border-color:var(--gold);}
  .go{background:var(--apricot);border:none;color:#1A1610;padding:13px 30px;border-radius:10px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
  .go:hover{background:var(--gold-bright);}
  .go:disabled{opacity:.5;cursor:not-allowed;}

  .statbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .sc{display:flex;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:7px 14px;
    font-size:13px;cursor:pointer;font-family:inherit;color:var(--text-muted);transition:.15s;}
  .sc:hover{border-color:var(--gold);}
  .sc.on{border-color:var(--gold);color:var(--text);background:var(--surface-2);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .sc b{color:var(--text);font-weight:700;}
  .spacer{flex:1;}
  .total{font-size:13px;color:var(--text-muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;transition:.18s;}
  .card:hover{border-color:var(--gold);transform:translateY(-3px);}
  .thumb{position:relative;width:100%;aspect-ratio:9/13;background:#000;overflow:hidden;}
  .thumb.wide{aspect-ratio:16/10;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .rank{position:absolute;top:8px;left:8px;background:rgba(26,22,16,.86);color:var(--gold-bright);
    font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;backdrop-filter:blur(4px);}
  .hot{position:absolute;top:8px;right:8px;background:var(--apricot);color:#1A1610;
    font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;letter-spacing:.04em;}
  .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;
    font-size:11px;padding:3px 7px;border-radius:5px;}
  .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:9px;flex:1;}
  .title{font-size:14px;line-height:1.42;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .chan{font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:2px;}
  .chan .cn{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rate{font-size:13px;font-weight:700;color:var(--up);display:flex;align-items:center;gap:4px;}
  .rate small{font-weight:400;color:var(--text-muted);font-size:11px;}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;}
  .b-new{background:rgba(91,169,216,.16);color:var(--new);}
  .b-up{background:rgba(95,191,127,.16);color:var(--up);}
  .b-down{background:rgba(216,112,95,.16);color:var(--down);}
  .b-hold{background:rgba(138,130,114,.16);color:var(--hold);}
  .score{font-size:13px;font-weight:700;color:var(--gold-bright);}

  .msg{padding:44px 20px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.7;}
  .msg strong{color:var(--text);display:block;margin-bottom:6px;font-size:16px;}
  .err{background:rgba(201,88,74,.12);border:1px solid var(--danger);color:#F0BDB5;
    padding:14px 16px;border-radius:10px;font-size:14px;margin-bottom:18px;line-height:1.6;}
  .hint{font-size:12px;color:var(--text-muted);line-height:1.6;margin-top:12px;}
  .live{color:var(--up);font-weight:700;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
    border-top-color:var(--apricot);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (max-width:640px){
    h1{font-size:24px;}
    .keybox,.keybox input{width:100%;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">YouTube Research</div>
      <h1>떡상 <em>쇼츠</em> 파인더</h1>
    </div>
    <div class="keybox">
      <label for="apikey">YouTube API 키 <span style="opacity:.7">— 키워드 검색에만 필요</span></label>
      <input id="apikey" autocomplete="off" spellcheck="false" placeholder="AIza...">
      <div class="note">이 브라우저에만 저장됩니다</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="trend">🔥 터진 영상</button>
    <button class="tab" data-tab="search">🔍 키워드 검색</button>
  </div>

  <section id="tab-trend">
    <div class="panel">
      <div class="row">
        <div class="flabel">영상 타입</div>
        <button class="chip on" data-g="tType" data-v="short">쇼츠</button>
        <button class="chip" data-g="tType" data-v="long">롱폼</button>
        <button class="chip" data-g="tType" data-v="all">전체</button>
        <div style="width:1px;height:24px;background:var(--line);margin:0 6px"></div>
        <button class="chip on" data-g="tSort" data-v="rate">🔥 급등순</button>
        <button class="chip" data-g="tSort" data-v="views">조회수순</button>
        <button class="chip" data-g="tSort" data-v="date">최신순</button>
      </div>

      <div class="row">
        <div class="flabel">카테고리</div>
        <select id="category">
          <option value="">전체</option>
          <option value="24">엔터테인먼트</option>
          <option value="10">음악</option>
          <option value="23">코미디</option>
          <option value="26">노하우 / 스타일</option>
          <option value="22">인물 / 블로그</option>
          <option value="20">게임</option>
          <option value="17">스포츠</option>
          <option value="25">뉴스 / 정치</option>
          <option value="27">교육</option>
          <option value="28">과학 / 기술</option>
          <option value="1">영화 / 애니메이션</option>
          <option value="15">동물</option>
        </select>
        <button class="go" id="btnReload">🔄 새로고침</button>
      </div>

      <div class="hint" id="collectInfo">데이터를 불러오는 중…</div>
    </div>

    <div class="statbar" id="statbar" style="display:none">
      <button class="sc on" data-st="all">전체 <b id="c-all">0</b></button>
      <button class="sc" data-st="new"><span class="dot" style="background:var(--new)"></span>신규 <b id="c-new">0</b></button>
      <button class="sc" data-st="up"><span class="dot" style="background:var(--up)"></span>상승 <b id="c-up">0</b></button>
      <button class="sc" data-st="down"><span class="dot" style="background:var(--down)"></span>하락 <b id="c-down">0</b></button>
      <button class="sc" data-st="hold"><span class="dot" style="background:var(--hold)"></span>유지 <b id="c-hold">0</b></button>
      <div class="spacer"></div>
      <div class="total" id="trendTotal"></div>
    </div>

    <div id="trendOut"><div class="msg"><span class="spin"></span> 불러오는 중…</div></div>
  </section>

  <section id="tab-search" style="display:none">
    <div class="panel">
      <div class="row">
        <input id="q" placeholder="예: 건조과일, 수제간식, 홈카페" autocomplete="off">
        <button class="go" id="btnSearch">검색</button>
      </div>

      <div class="row">
        <div class="flabel">빠른 키워드</div>
        <button class="chip kw">건조과일</button>
        <button class="chip kw">수제간식</button>
        <button class="chip kw">홈카페</button>
        <button class="chip kw">간식 레시피</button>
        <button class="chip kw">다이어트 간식</button>
        <button class="chip kw">아이 간식</button>
        <button class="chip kw">디저트</button>
        <button class="chip kw">비건</button>
      </div>

      <div class="row">
        <div class="flabel">영상 타입</div>
        <button class="chip on" data-g="type" data-v="short">쇼츠 (3분 이하)</button>
        <button class="chip" data-g="type" data-v="long">롱폼</button>
      </div>

      <div class="row">
        <div class="flabel">업로드 기간</div>
        <button class="chip" data-g="days" data-v="7">1주</button>
        <button class="chip on" data-g="days" data-v="30">1개월</button>
        <button class="chip" data-g="days" data-v="90">3개월</button>
        <button class="chip" data-g="days" data-v="365">1년</button>
      </div>

      <div class="row">
        <div class="flabel">구독자 규모</div>
        <button class="chip on" data-g="sub" data-v="all">전체</button>
        <button class="chip" data-g="sub" data-v="0-1000">1천 미만</button>
        <button class="chip" data-g="sub" data-v="1000-10000">1천~1만</button>
        <button class="chip" data-g="sub" data-v="10000-100000">1만~10만</button>
        <button class="chip" data-g="sub" data-v="100000-999999999">10만 이상</button>
      </div>

      <div class="row">
        <div class="flabel">검색 범위 (넓을수록 결과 많음 · 할당량 소모 큼)</div>
        <button class="chip" data-g="depth" data-v="1">빠르게</button>
        <button class="chip on" data-g="depth" data-v="2">보통</button>
        <button class="chip" data-g="depth" data-v="3">넓게</button>
        <button class="chip" data-g="depth" data-v="4">최대</button>
      </div>

      <div class="row">
        <div class="flabel">정렬</div>
        <button class="chip on" data-g="sortS" data-v="score">떡상지수순</button>
        <button class="chip" data-g="sortS" data-v="views">조회수순</button>
        <button class="chip" data-g="sortS" data-v="daily">일일 조회수순</button>
      </div>

      <div class="hint">떡상지수 = 조회수 ÷ 구독자 수. 지수가 높아도 조회수가 낮으면 참고 가치가 없습니다. 두 숫자를 같이
